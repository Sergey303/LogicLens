name: Verify semantic planning benchmark v0

on:
  pull_request:
    paths:
      - "experiments/presentation/semantic-planning-v0/**"
      - "tools/verify_semantic_planning_benchmark.py"
      - "tests/semantic_planning_benchmark_test.py"
      - "docs/runbooks/semantic-planning-benchmark.md"
      - ".github/workflows/verify-semantic-planning-benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/presentation/semantic-planning-v0/**"
      - "tools/verify_semantic_planning_benchmark.py"
      - "tests/semantic_planning_benchmark_test.py"
      - "docs/runbooks/semantic-planning-benchmark.md"
      - ".github/workflows/verify-semantic-planning-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: verify-semantic-planning-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen benchmark and negative cases
        run: |
          python -m py_compile \
            tools/verify_semantic_planning_benchmark.py \
            tests/semantic_planning_benchmark_test.py
          python tests/semantic_planning_benchmark_test.py
          python tools/verify_semantic_planning_benchmark.py --json
