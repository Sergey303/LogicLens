name: Verify Qwen-only Builder path

on:
  pull_request:
    paths:
      - "experiments/builder/eng-26-researcher-at-iis/prompt.md"
      - "experiments/builder/eng-26-researcher-at-iis/task.json"
      - "tools/run_builder_ollama.py"
      - "tools/run_builder_ollama_compat.py"
      - "tools/run_builder_ollama_literal_compat.py"
      - "tools/run_builder_qwen_only.py"
      - "tools/run_builder_qwen_only_compat.py"
      - "tools/builder_candidate/**"
      - "tests/builder_qwen_prompt_test.py"
      - "tests/builder_qwen_only_test.py"
      - "tests/builder_plunit_directive_test.py"
      - "tests/builder_ollama_structured_output_test.py"
      - "tests/builder_ollama_literal_compat_test.py"
      - ".github/workflows/verify-qwen-builder.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/builder/eng-26-researcher-at-iis/prompt.md"
      - "experiments/builder/eng-26-researcher-at-iis/task.json"
      - "tools/run_builder_ollama.py"
      - "tools/run_builder_ollama_compat.py"
      - "tools/run_builder_ollama_literal_compat.py"
      - "tools/run_builder_qwen_only.py"
      - "tools/run_builder_qwen_only_compat.py"
      - "tools/builder_candidate/**"
      - "tests/builder_qwen_prompt_test.py"
      - "tests/builder_qwen_only_test.py"
      - "tests/builder_plunit_directive_test.py"
      - "tests/builder_ollama_structured_output_test.py"
      - "tests/builder_ollama_literal_compat_test.py"
      - ".github/workflows/verify-qwen-builder.yml"

permissions:
  contents: read

concurrency:
  group: verify-qwen-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused validator dependency
        run: python -m pip install "jsonschema==4.23.0"

      - name: Verify prompt, structured output, directive boundary and orchestration
        run: |
          python -m py_compile \
            tools/run_builder_ollama.py \
            tools/run_builder_ollama_compat.py \
            tools/run_builder_ollama_literal_compat.py \
            tools/run_builder_qwen_only.py \
            tools/run_builder_qwen_only_compat.py \
            tests/builder_qwen_prompt_test.py \
            tests/builder_plunit_directive_test.py \
            tests/builder_ollama_structured_output_test.py \
            tests/builder_qwen_only_test.py
          python tests/builder_qwen_prompt_test.py
          python tests/builder_plunit_directive_test.py
          python tests/builder_ollama_structured_output_test.py
          python tests/builder_qwen_only_test.py
