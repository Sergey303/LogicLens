name: Verify zero-epoch local run

on:
  pull_request:
    paths:
      - ".gitignore"
      - "contracts/**"
      - "data/Ontology.xml"
      - "epochs/epoch-000/**"
      - "fixtures/zero-epoch/**"
      - "src/LogicLens.Api/**"
      - "src/LogicLens.Core/**"
      - "src/LogicLens.Prolog/**"
      - "src/LogicLens.Protocol/**"
      - "src/LogicLens.Ui/**"
      - "src/LogicLens.Web/**"
      - "tests/**"
      - "tools/LogicLens.EpochCompiler/**"
      - "tools/LogicLens.OntologyCompiler/**"
      - "tools/active_epoch/**"
      - "tools/zero_epoch/**"
      - "tools/build_active_epoch.py"
      - "tools/run_zero_epoch.py"
      - "LogicLens.sln"
      - "README.md"
      - "docs/runbooks/zero-epoch-local-run.md"
      - ".github/workflows/verify-zero-epoch-local-run.yml"
  push:
    branches:
      - main
    paths:
      - ".gitignore"
      - "contracts/**"
      - "data/Ontology.xml"
      - "epochs/epoch-000/**"
      - "fixtures/zero-epoch/**"
      - "src/LogicLens.Api/**"
      - "src/LogicLens.Core/**"
      - "src/LogicLens.Prolog/**"
      - "src/LogicLens.Protocol/**"
      - "src/LogicLens.Ui/**"
      - "src/LogicLens.Web/**"
      - "tests/**"
      - "tools/LogicLens.EpochCompiler/**"
      - "tools/LogicLens.OntologyCompiler/**"
      - "tools/active_epoch/**"
      - "tools/zero_epoch/**"
      - "tools/build_active_epoch.py"
      - "tools/run_zero_epoch.py"
      - "LogicLens.sln"
      - "README.md"
      - "docs/runbooks/zero-epoch-local-run.md"
      - ".github/workflows/verify-zero-epoch-local-run.yml"

permissions:
  contents: read

concurrency:
  group: verify-zero-epoch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: src/LogicLens.Web/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository hygiene
        run: python tests/repository_hygiene_test.py

      - name: Install pinned SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
          swipl --version | tee /tmp/swipl-version.txt
          grep --fixed-strings "SWI-Prolog version 9.0.4" /tmp/swipl-version.txt

      - name: Compile and unit-test runner modules
        run: |
          set -o pipefail
          python -m py_compile \
            tools/run_zero_epoch.py \
            tools/zero_epoch/__init__.py \
            tools/zero_epoch/processes.py \
            tools/zero_epoch/verification.py \
            tools/zero_epoch/cli.py \
            tests/zero_epoch_runner_unit_test.py
          python tests/zero_epoch_runner_unit_test.py 2>&1 \
            | tee /tmp/zero-epoch-runner-unit.log

      - name: Run the documented zero-epoch command
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python tools/run_zero_epoch.py \
            --verify-only \
            --no-browser \
            | tee /tmp/zero-epoch-run.log

      - name: Verify disposable runtime contents
        run: |
          test -f .logiclens/zero-epoch/active-epoch-000/manifest.json
          test -f .logiclens/zero-epoch/logs/api.log
          test -f .logiclens/zero-epoch/logs/web.log
          test -f src/LogicLens.Web/dist/index.html
          test ! -e .logiclens/zero-epoch/active-epoch-000/data/Ontology.xml
          test ! -d .logiclens/zero-epoch/active-epoch-000/bin
          test ! -d .logiclens/zero-epoch/active-epoch-000/obj

      - name: Upload prepared runtime and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logiclens-zero-epoch-local-run
          path: |
            ${{ runner.temp }}/tracked-python-bytecode.txt
            /tmp/swipl-version.txt
            /tmp/zero-epoch-runner-unit.log
            /tmp/zero-epoch-run.log
            .logiclens/zero-epoch/active-epoch-000/manifest.json
            .logiclens/zero-epoch/logs
            src/LogicLens.Web/dist
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
