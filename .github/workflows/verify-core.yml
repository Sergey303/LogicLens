name: Verify core

on:
  pull_request:
    paths:
      - "src/LogicLens.Core/**"
      - "tests/LogicLens.Core.Verification/**"
      - "fixtures/zero-epoch/**"
      - "LogicLens.sln"
      - ".github/workflows/verify-core.yml"
  push:
    branches:
      - main
    paths:
      - "src/LogicLens.Core/**"
      - "tests/LogicLens.Core.Verification/**"
      - "fixtures/zero-epoch/**"
      - "LogicLens.sln"
      - ".github/workflows/verify-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LogicLens.sln

      - name: Build
        run: dotnet build LogicLens.sln --configuration Release --no-restore

      - name: Verify canonical facts and fixture
        run: >-
          dotnet run
          --project tests/LogicLens.Core.Verification/LogicLens.Core.Verification.csproj
          --configuration Release
          --no-build
