name: Verify core

on:
  pull_request:
    paths:
      - "src/LogicLens.Core/**"
      - "tests/LogicLens.Core.Verification/**"
      - "fixtures/zero-epoch/**"
      - ".github/workflows/verify-core.yml"
  push:
    branches:
      - main
    paths:
      - "src/LogicLens.Core/**"
      - "tests/LogicLens.Core.Verification/**"
      - "fixtures/zero-epoch/**"
      - ".github/workflows/verify-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore core verification
        run: >-
          dotnet restore
          tests/LogicLens.Core.Verification/LogicLens.Core.Verification.csproj

      - name: Build core verification
        run: |
          dotnet build \
            tests/LogicLens.Core.Verification/LogicLens.Core.Verification.csproj \
            --configuration Release \
            --no-restore \
            2>&1 | tee /tmp/core-build.log

      - name: Verify canonical facts and fixture
        id: core-verification
        shell: bash
        run: |
          set +e
          dotnet run \
            --project tests/LogicLens.Core.Verification/LogicLens.Core.Verification.csproj \
            --configuration Release \
            --no-build \
            > core-verification.log 2>&1
          exit_code=$?
          cat core-verification.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification-log
          path: |
            /tmp/core-build.log
            core-verification.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when verification failed
        if: steps.core-verification.outputs.exit_code != '0'
        run: exit 1
