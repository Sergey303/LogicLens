name: Verify Ollama HTTP diagnostics

on:
  pull_request:
    paths:
      - "tools/run_builder_ollama_compat.py"
      - "tools/run_builder_ollama_literal_compat.py"
      - "tools/run_builder_qwen_only_compat.py"
      - "tools/build_epoch_candidate_utf8_compat.py"
      - "tools/builder_experiment_utf8_compat.py"
      - "tests/builder_ollama_compat_test.py"
      - "tests/builder_ollama_literal_compat_test.py"
      - "tests/builder_utf8_compat_test.py"
      - ".github/workflows/verify-ollama-compat.yml"
  push:
    branches: [main]
    paths:
      - "tools/run_builder_ollama_compat.py"
      - "tools/run_builder_ollama_literal_compat.py"
      - "tools/run_builder_qwen_only_compat.py"
      - "tools/build_epoch_candidate_utf8_compat.py"
      - "tools/builder_experiment_utf8_compat.py"
      - "tests/builder_ollama_compat_test.py"
      - "tests/builder_ollama_literal_compat_test.py"
      - "tests/builder_utf8_compat_test.py"
      - ".github/workflows/verify-ollama-compat.yml"

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused validator dependency
        run: python -m pip install --quiet "jsonschema==4.23.0"
      - name: Compile transport compatibility modules
        run: |
          python -m py_compile \
            tools/run_builder_ollama_compat.py \
            tools/run_builder_qwen_only_compat.py \
            tools/build_epoch_candidate_utf8_compat.py \
            tools/builder_experiment_utf8_compat.py \
            tests/builder_ollama_compat_test.py \
            tests/builder_utf8_compat_test.py
      - name: Verify structured Ollama adapter and HTTP diagnostics
        run: python tests/builder_ollama_compat_test.py
      - name: Verify UTF-8 validator transport
        run: python tests/builder_utf8_compat_test.py

  literal-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SWI-Prolog runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --yes --no-install-recommends swi-prolog-nox
      - name: Compile literal compatibility modules
        run: |
          python -m py_compile \
            tools/run_builder_ollama_compat.py \
            tools/run_builder_ollama_literal_compat.py \
            tools/run_builder_qwen_only_compat.py \
            tests/builder_ollama_literal_compat_test.py
      - name: Verify language literal renderer on SWI-Prolog
        run: python tests/builder_ollama_literal_compat_test.py
