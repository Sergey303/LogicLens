name: Verify active epoch package

on:
  pull_request:
    paths:
      - "contracts/prolog-cli-v0.schema.json"
      - "contracts/epoch-candidate-v0.schema.json"
      - "contracts/builder-task-v0.schema.json"
      - "contracts/builder-run-v0.schema.json"
      - "data/Ontology.xml"
      - "docs/adr/0008-active-epoch-package.md"
      - "docs/adr/0010-builder-candidate-package.md"
      - "docs/adr/0011-builder-experiment-envelope.md"
      - "docs/runbooks/builder-provider-experiment.md"
      - "epochs/epoch-000/**"
      - "experiments/builder/**"
      - "fixtures/zero-epoch/**"
      - "fixtures/builder-candidate/**"
      - "fixtures/builder-experiment/**"
      - "src/LogicLens.Core/**"
      - "src/LogicLens.Prolog/**"
      - "tools/LogicLens.EpochCompiler/**"
      - "tools/LogicLens.OntologyCompiler/**"
      - "tools/active_epoch/**"
      - "tools/builder_candidate/**"
      - "tools/builder_experiment/**"
      - "tools/build_active_epoch.py"
      - "tools/build_epoch_candidate.py"
      - "tools/builder_experiment.py"
      - "tools/run_builder_ollama.py"
      - "tools/run_builder_codex.py"
      - "tools/run_builder_provider_pair.py"
      - "tests/active_epoch_package_test.py"
      - "tests/builder_candidate_contract_test.py"
      - "tests/builder_candidate_meta_call_test.py"
      - "tests/builder_experiment_contract_test.py"
      - "tests/builder_ollama_adapter_test.py"
      - "tests/builder_codex_adapter_test.py"
      - ".github/workflows/verify-active-epoch.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/prolog-cli-v0.schema.json"
      - "contracts/epoch-candidate-v0.schema.json"
      - "contracts/builder-task-v0.schema.json"
      - "contracts/builder-run-v0.schema.json"
      - "data/Ontology.xml"
      - "docs/adr/0008-active-epoch-package.md"
      - "docs/adr/0010-builder-candidate-package.md"
      - "docs/adr/0011-builder-experiment-envelope.md"
      - "docs/runbooks/builder-provider-experiment.md"
      - "epochs/epoch-000/**"
      - "experiments/builder/**"
      - "fixtures/zero-epoch/**"
      - "fixtures/builder-candidate/**"
      - "fixtures/builder-experiment/**"
      - "src/LogicLens.Core/**"
      - "src/LogicLens.Prolog/**"
      - "tools/LogicLens.EpochCompiler/**"
      - "tools/LogicLens.OntologyCompiler/**"
      - "tools/active_epoch/**"
      - "tools/builder_candidate/**"
      - "tools/builder_experiment/**"
      - "tools/build_active_epoch.py"
      - "tools/build_epoch_candidate.py"
      - "tools/builder_experiment.py"
      - "tools/run_builder_ollama.py"
      - "tools/run_builder_codex.py"
      - "tools/run_builder_provider_pair.py"
      - "tests/active_epoch_package_test.py"
      - "tests/builder_candidate_contract_test.py"
      - "tests/builder_candidate_meta_call_test.py"
      - "tests/builder_experiment_contract_test.py"
      - "tests/builder_ollama_adapter_test.py"
      - "tests/builder_codex_adapter_test.py"
      - ".github/workflows/verify-active-epoch.yml"

permissions:
  contents: read

concurrency:
  group: verify-active-epoch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned SWI-Prolog and JSON Schema validator
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
          swipl --version | tee /tmp/swipl-version.txt
          grep --fixed-strings "SWI-Prolog version 9.0.4" /tmp/swipl-version.txt
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Restore and build solution
        run: |
          dotnet restore LogicLens.sln
          dotnet build LogicLens.sln --configuration Release --no-restore

      - name: Resolve package source commit
        run: |
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            source_commit=$(git rev-parse HEAD^2)
          else
            source_commit=$(git rev-parse HEAD)
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Build active epoch twice
        run: |
          mkdir --parents /tmp/active-epoch-a /tmp/active-epoch-b
          python tools/build_active_epoch.py \
            --repository-root . \
            --output /tmp/active-epoch-a \
            --engine-commit "$SOURCE_COMMIT" \
            --no-build
          python tools/build_active_epoch.py \
            --repository-root . \
            --output /tmp/active-epoch-b \
            --engine-commit "$SOURCE_COMMIT" \
            --no-build

      - name: Verify determinism hashes and portable smoke commands
        run: |
          set -o pipefail
          python tests/active_epoch_package_test.py \
            --first /tmp/active-epoch-a \
            --second /tmp/active-epoch-b \
            --run-smoke \
            2>&1 | tee /tmp/active-epoch-verification.log

      - name: Build provider-neutral candidate fixture
        run: |
          set -o pipefail
          python tools/build_epoch_candidate.py \
            --baseline /tmp/active-epoch-a \
            --proposal fixtures/builder-candidate/valid \
            --schema contracts/epoch-candidate-v0.schema.json \
            --output /tmp/builder-candidate-package \
            --report /tmp/builder-candidate-comparison.json \
            2>&1 | tee /tmp/builder-candidate-build.log

      - name: Verify candidate isolation determinism and rejection cases
        run: |
          set -o pipefail
          python tests/builder_candidate_contract_test.py \
            --baseline /tmp/active-epoch-a \
            --schema contracts/epoch-candidate-v0.schema.json \
            --fixture fixtures/builder-candidate/valid \
            2>&1 | tee /tmp/builder-candidate-verification.log
          python tests/builder_candidate_meta_call_test.py \
            --baseline /tmp/active-epoch-a \
            --schema contracts/epoch-candidate-v0.schema.json \
            --fixture fixtures/builder-candidate/valid \
            2>&1 | tee -a /tmp/builder-candidate-verification.log

      - name: Build retained fixture provider runs
        run: |
          set -o pipefail
          task=experiments/builder/eng-26-researcher-at-iis
          python tools/builder_experiment.py prepare \
            --baseline /tmp/active-epoch-a \
            --task "$task" \
            --task-schema contracts/builder-task-v0.schema.json \
            --candidate-schema contracts/epoch-candidate-v0.schema.json \
            --output /tmp/builder-workspace \
            2>&1 | tee /tmp/builder-experiment-build.log
          python tools/builder_experiment.py import-run \
            --baseline /tmp/active-epoch-a \
            --task "$task" \
            --task-schema contracts/builder-task-v0.schema.json \
            --candidate-schema contracts/epoch-candidate-v0.schema.json \
            --run-schema contracts/builder-run-v0.schema.json \
            --workspace /tmp/builder-workspace \
            --proposal fixtures/builder-experiment/qwen \
            --output /tmp/builder-run-qwen \
            --run-id fixture-qwen \
            2>&1 | tee -a /tmp/builder-experiment-build.log
          python tools/builder_experiment.py import-run \
            --baseline /tmp/active-epoch-a \
            --task "$task" \
            --task-schema contracts/builder-task-v0.schema.json \
            --candidate-schema contracts/epoch-candidate-v0.schema.json \
            --run-schema contracts/builder-run-v0.schema.json \
            --workspace /tmp/builder-workspace \
            --proposal fixtures/builder-experiment/codex \
            --output /tmp/builder-run-codex \
            --run-id fixture-codex \
            2>&1 | tee -a /tmp/builder-experiment-build.log
          python tools/builder_experiment.py compare \
            --run-schema contracts/builder-run-v0.schema.json \
            --run /tmp/builder-run-qwen \
            --run /tmp/builder-run-codex \
            --output /tmp/builder-run-comparison.json \
            2>&1 | tee -a /tmp/builder-experiment-build.log

      - name: Verify frozen task run envelopes hidden oracle and comparison
        run: |
          set -o pipefail
          task=experiments/builder/eng-26-researcher-at-iis
          python tests/builder_experiment_contract_test.py \
            --baseline /tmp/active-epoch-a \
            --task "$task" \
            --task-schema contracts/builder-task-v0.schema.json \
            --candidate-schema contracts/epoch-candidate-v0.schema.json \
            --run-schema contracts/builder-run-v0.schema.json \
            --qwen-fixture fixtures/builder-experiment/qwen \
            --codex-fixture fixtures/builder-experiment/codex \
            2>&1 | tee /tmp/builder-experiment-verification.log
          python tests/builder_ollama_adapter_test.py \
            --baseline /tmp/active-epoch-a \
            --task "$task" \
            --task-schema contracts/builder-task-v0.schema.json \
            --candidate-schema contracts/epoch-candidate-v0.schema.json \
            --run-schema contracts/builder-run-v0.schema.json \
            --response fixtures/builder-experiment/ollama-response.json \
            2>&1 | tee -a /tmp/builder-experiment-verification.log
          python tests/builder_codex_adapter_test.py \
            --baseline /tmp/active-epoch-a \
            --task "$task" \
            --task-schema contracts/builder-task-v0.schema.json \
            --candidate-schema contracts/epoch-candidate-v0.schema.json \
            --run-schema contracts/builder-run-v0.schema.json \
            --response fixtures/builder-experiment/codex-response.json \
            2>&1 | tee -a /tmp/builder-experiment-verification.log

      - name: Stage builder candidate artifact
        run: |
          mkdir --parents /tmp/builder-candidate-artifact
          cp --recursive \
            /tmp/builder-candidate-package \
            /tmp/builder-candidate-artifact/package
          cp \
            /tmp/builder-candidate-comparison.json \
            /tmp/builder-candidate-artifact/comparison.json

      - name: Stage Builder experiment artifact
        run: |
          mkdir --parents /tmp/builder-experiment-artifact
          cp --recursive /tmp/builder-workspace \
            /tmp/builder-experiment-artifact/workspace
          cp --recursive /tmp/builder-run-qwen \
            /tmp/builder-experiment-artifact/qwen
          cp --recursive /tmp/builder-run-codex \
            /tmp/builder-experiment-artifact/codex
          cp /tmp/builder-run-comparison.json \
            /tmp/builder-experiment-artifact/comparison.json

      - name: Upload portable active epoch
        uses: actions/upload-artifact@v4
        with:
          name: logiclens-active-epoch-000
          path: /tmp/active-epoch-a
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified builder candidate
        uses: actions/upload-artifact@v4
        with:
          name: logiclens-builder-candidate-fixture
          path: /tmp/builder-candidate-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified Builder experiment fixtures
        uses: actions/upload-artifact@v4
        with:
          name: logiclens-builder-experiment-fixtures
          path: /tmp/builder-experiment-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-epoch-verification
          path: |
            /tmp/swipl-version.txt
            /tmp/active-epoch-verification.log
            /tmp/builder-candidate-build.log
            /tmp/builder-candidate-verification.log
            /tmp/builder-experiment-build.log
            /tmp/builder-experiment-verification.log
          if-no-files-found: warn
          retention-days: 14
