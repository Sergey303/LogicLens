name: Verify Builder activation decision

on:
  pull_request:
    paths:
      - "contracts/activation-decision-v0.schema.json"
      - "docs/adr/0018-reviewed-activation-decision.md"
      - "tools/build_builder_activation_decision.py"
      - "tests/builder_activation_decision_test.py"
      - ".github/workflows/verify-builder-activation-decision.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/activation-decision-v0.schema.json"
      - "docs/adr/0018-reviewed-activation-decision.md"
      - "tools/build_builder_activation_decision.py"
      - "tests/builder_activation_decision_test.py"
      - ".github/workflows/verify-builder-activation-decision.yml"

permissions:
  contents: read

concurrency:
  group: verify-builder-activation-decision-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
          sudo apt-get update -qq
          sudo apt-get install -qq --yes --no-install-recommends swi-prolog-nox

      - name: Compile activation decision modules
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile \
            tools/build_builder_activation_decision.py \
            tests/builder_activation_decision_test.py

      - name: Verify reviewed activation decision
        env:
          PYTHONPATH: tools
        run: python tests/builder_activation_decision_test.py
