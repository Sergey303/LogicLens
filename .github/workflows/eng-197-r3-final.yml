name: ENG-197 R3 final pre-pinned PostgreSQL evidence

on:
  pull_request:
    paths:
      - '.github/workflows/eng-197-r3-final.yml'
      - 'EpistemicCompilerLab/research-execution/relational-comparator/ENG-197_FREEZE_MANIFEST.json'
      - 'EpistemicCompilerLab/research-execution/relational-comparator/RUNTIME_DEPENDENCIES.json'
      - 'EpistemicCompilerLab/research-execution/relational-comparator/prototype/live_postgres_smoke.py'
      - 'EpistemicCompilerLab/scripts/run-relational-postgres-smoke.ps1'

permissions:
  contents: read

env:
  ENG197_REQUIRED_POSTGRES_IMAGE: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636

jobs:
  r3-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: eng197_ephemeral_ci
          POSTGRES_DB: eng197_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eng197_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact frozen PostgreSQL transport
        run: python -m pip install --disable-pip-version-check -r EpistemicCompilerLab/research-execution/relational-comparator/requirements-eng197.txt

      - name: Verify static comparator and committed freeze closure
        run: |
          python EpistemicCompilerLab/research-execution/relational-comparator/prototype/verify.py
          python EpistemicCompilerLab/research-execution/relational-comparator/prototype/build_freeze_manifest.py --check

      - name: Prove precommitted image identity before DB execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          runtime = json.loads(Path('EpistemicCompilerLab/research-execution/relational-comparator/RUNTIME_DEPENDENCIES.json').read_text())
          expected = runtime['postgresql']['container']['required_repo_digest']
          assert expected == runtime['postgresql']['container']['required_image_reference']
          assert expected == os.environ['ENG197_REQUIRED_POSTGRES_IMAGE']
          assert runtime['postgresql']['container']['mutable_tag_execution_forbidden'] is True
          assert runtime['postgresql']['container']['pin_timing'] == 'before_service_start_and_before_database_execution'
          raw = subprocess.check_output(['docker', 'image', 'inspect', expected, '--format', '{{json .RepoDigests}}'], text=True).strip()
          digests = json.loads(raw)
          assert expected in digests, (expected, digests)
          print(json.dumps({'precommitted_digest': expected, 'available_repo_digests': digests}, sort_keys=True))
          PY
          echo "ENG197_POSTGRES_IMAGE_DIGEST=$ENG197_REQUIRED_POSTGRES_IMAGE" >> "$GITHUB_ENV"

      - name: Prove local reviewer runner cannot rewrite freeze manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('EpistemicCompilerLab/scripts/run-relational-postgres-smoke.ps1')
          text = p.read_text(encoding='utf-8')
          assert '& $python.Source $ManifestBuilder --check' in text
          assert '& $python.Source $ManifestBuilder\n' not in text
          assert 'Manifest generation is a separate producer freeze operation' in text
          print('PASS local runner is freeze-check-only')
          PY

      - name: Execute actual PostgreSQL path and persist pre-score bytes
        env:
          ENG197_POSTGRES_DSN: postgresql://postgres:eng197_ephemeral_ci@localhost:5432/eng197_smoke
        run: >-
          python EpistemicCompilerLab/research-execution/relational-comparator/prototype/live_postgres_smoke.py
          --output artifacts/eng-197-r3/postgres-smoke

      - name: Build post-smoke strict-subset differential
        run: >-
          python EpistemicCompilerLab/research-execution/relational-comparator/prototype/build_subset_equivalence_report.py
          --smoke-output artifacts/eng-197-r3/postgres-smoke

      - name: Fail closed on R3 evidence contract
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('artifacts/eng-197-r3/postgres-smoke')
          live_path = root / 'eng197-live-postgres-report.json'
          eq_path = root / 'eng197-subset-equivalence-report.json'
          live = json.loads(live_path.read_text())
          eq = json.loads(eq_path.read_text())
          runtime = json.loads(Path('EpistemicCompilerLab/research-execution/relational-comparator/RUNTIME_DEPENDENCIES.json').read_text())
          expected = runtime['postgresql']['container']['required_repo_digest']
          assert expected == os.environ['ENG197_REQUIRED_POSTGRES_IMAGE']
          assert live['status'] == 'PASS'
          assert live['runtime']['execution_identity'] == 'container_digest_pre_pinned'
          assert live['runtime']['container_image_digest'] == expected
          assert live['runtime']['server_version'] == '18.4'
          assert live['runtime']['server_version_num'] == 180004
          assert live['runtime']['psycopg_version'] == '3.3.4'
          assert live['security_negatives']['all_passed'] is True
          assert {c['evaluation'] for c in live['cases']} == {'PASS'}
          assert {c['case_id'] for c in live['cases']} == {'proto-01','proto-02','proto-03','proto-04'}
          pre = sorted((root / 'pre-score').glob('*.json'))
          assert len(pre) == 4
          for path in pre:
              record = json.loads(path.read_text())
              assert record['stage'] == 'pre_score_db_result'
              assert record['score'] is None
              assert record['result_bytes_utf8']
          assert eq['eligible'] is True
          assert eq['all_exact'] is True
          assert eq['exact_case_count'] == eq['case_count'] == 4
          assert eq['proof_graph_equivalence_claimed'] is False
          assert all(row['exact_result_equal'] for row in eq['cases'])
          attestation = {
              'schema_version': '1.0.0',
              'linear_issue': 'ENG-197',
              'evidence_class': 'TRAIN_DEV_REAL_POSTGRESQL_PREPINNED_EXECUTION_NOT_MODEL_EFFECT',
              'postgresql_image_digest': expected,
              'container_pin_timing': 'PRECOMMITTED_BEFORE_SERVICE_START',
              'freeze_manifest_behavior': 'CHECK_ONLY_AT_EXECUTION',
              'local_runner_manifest_behavior': 'CHECK_ONLY_NO_REWRITE',
              'live_report_sha256': hashlib.sha256(live_path.read_bytes()).hexdigest(),
              'equivalence_report_sha256': hashlib.sha256(eq_path.read_bytes()).hexdigest(),
              'case_count': 4,
              'subset_all_exact': True,
              'permission_negatives_pass': True,
              'm15_status': 'DEV_ONLY_SINGLE_ENDPOINT_SCHEMA_DIAGNOSTIC',
              'm16_status': 'READY_FOR_DISTINCT_INDEPENDENT_RE_REVIEW',
              'm16_confirmatory_authorized': False,
              'independent_review': 'NOT_PERFORMED',
              'holdout_replication_access': 'NONE'
          }
          out = root / 'eng197-r3-evidence-attestation.json'
          out.write_text(json.dumps(attestation, indent=2, sort_keys=True) + '\n')
          print(json.dumps(attestation, sort_keys=True))
          PY

      - name: Upload retained R3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng-197-r3-prepinned-postgres-evidence
          path: artifacts/eng-197-r3/postgres-smoke/
          if-no-files-found: warn
          retention-days: 30
