name: Verify experimental Epistemic DSL core v0

on:
  pull_request:
    paths:
      - "EpistemicCompilerLab/progressive-dsl/core-v0/**"
      - "EpistemicCompilerLab/progressive-dsl/opinion-d2/runtime.py"
      - "EpistemicCompilerLab/scripts/launch.ps1"
      - "EpistemicCompilerLab/scripts/run-progressive-core-tests.ps1"
      - ".github/workflows/verify-epistemic-core-v0.yml"
  push:
    branches:
      - main
    paths:
      - "EpistemicCompilerLab/progressive-dsl/core-v0/**"
      - "EpistemicCompilerLab/progressive-dsl/opinion-d2/runtime.py"
      - "EpistemicCompilerLab/scripts/launch.ps1"
      - "EpistemicCompilerLab/scripts/run-progressive-core-tests.ps1"
      - ".github/workflows/verify-epistemic-core-v0.yml"

permissions:
  contents: read

concurrency:
  group: verify-epistemic-core-v0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema dependency
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Verify frozen CTO-course core contract
        run: |
          python EpistemicCompilerLab/progressive-dsl/core-v0/verify_contract.py \
            | tee /tmp/epistemic-core-v0.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-core-v0
          path: /tmp/epistemic-core-v0.log
          if-no-files-found: warn
          retention-days: 14
