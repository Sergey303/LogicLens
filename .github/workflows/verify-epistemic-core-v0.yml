name: Verify synthetic Epistemic semantic kernel v0

on:
  pull_request:
    paths:
      - "EpistemicCompilerLab/progressive-dsl/core-v0/**"
      - "EpistemicCompilerLab/progressive-dsl/opinion-d2/runtime.py"
      - "EpistemicCompilerLab/scripts/launch.ps1"
      - "EpistemicCompilerLab/scripts/run-progressive-core-tests.ps1"
      - ".github/workflows/verify-epistemic-core-v0.yml"
  push:
    branches:
      - main
    paths:
      - "EpistemicCompilerLab/progressive-dsl/core-v0/**"
      - "EpistemicCompilerLab/progressive-dsl/opinion-d2/runtime.py"
      - "EpistemicCompilerLab/scripts/launch.ps1"
      - "EpistemicCompilerLab/scripts/run-progressive-core-tests.ps1"
      - ".github/workflows/verify-epistemic-core-v0.yml"

permissions:
  contents: read

concurrency:
  group: verify-synthetic-epistemic-kernel-v0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
          swipl --version | tee /tmp/swipl-version.txt
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Verify hash-frozen synthetic kernel and independent D2 oracle
        run: |
          set -euo pipefail
          python EpistemicCompilerLab/progressive-dsl/core-v0/verify_contract.py \
            --swipl swipl \
            | tee /tmp/synthetic-epistemic-kernel-v0.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-epistemic-kernel-v0
          path: |
            /tmp/swipl-version.txt
            /tmp/synthetic-epistemic-kernel-v0.log
            EpistemicCompilerLab/progressive-dsl/core-v0/manifest-v0.json
            EpistemicCompilerLab/progressive-dsl/core-v0/expected-frames-v0.jsonl
          if-no-files-found: error
          retention-days: 30
