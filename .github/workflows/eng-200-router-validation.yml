name: ENG-200 router comparator validation

on:
  pull_request:
    paths:
      - 'EpistemicCompilerLab/research-execution/router-comparator/**'
      - 'EpistemicCompilerLab/scripts/run-router-comparator-tests.ps1'
      - 'EpistemicCompilerLab/scripts/launch.ps1'
      - '.github/workflows/eng-200-router-validation.yml'
  push:
    branches:
      - eng-200-router-comparator
    paths:
      - 'EpistemicCompilerLab/research-execution/router-comparator/**'
      - 'EpistemicCompilerLab/scripts/run-router-comparator-tests.ps1'
      - 'EpistemicCompilerLab/scripts/launch.ps1'
      - '.github/workflows/eng-200-router-validation.yml'

jobs:
  verify-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.0
      - name: Verify deterministic generation is clean
        working-directory: EpistemicCompilerLab/research-execution/router-comparator
        run: |
          cp prototype/generated/policy.pl /tmp/policy.pl
          cp prototype/generated/qwen-catalogue.neutral.json /tmp/neutral.json
          cp prototype/generated/qwen-catalogue.adapted.json /tmp/adapted.json
          python prototype/generate_policy.py
          python prototype/generate_visible_catalogue.py
          cmp /tmp/policy.pl prototype/generated/policy.pl
          cmp /tmp/neutral.json prototype/generated/qwen-catalogue.neutral.json
          cmp /tmp/adapted.json prototype/generated/qwen-catalogue.adapted.json
          git diff --exit-code
      - name: Verify leakage mutation detection
        working-directory: EpistemicCompilerLab/research-execution/router-comparator
        run: python prototype/verify_leakage_mutation.py
      - name: Run exhaustive tree-Prolog verification
        working-directory: EpistemicCompilerLab/research-execution/router-comparator
        run: python prototype/verify.py --require-swipl
      - name: Upload machine-readable verification
        uses: actions/upload-artifact@v4
        with:
          name: eng-200-router-verification
          path: EpistemicCompilerLab/research-execution/router-comparator/prototype/verification-report.json
          if-no-files-found: error
