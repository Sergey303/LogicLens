name: Verify candidate activation readiness

on:
  pull_request:
    paths:
      - "contracts/candidate-promotion-plan-v0.schema.json"
      - "contracts/candidate-activation-readiness-v0.schema.json"
      - "docs/adr/0014-builder-candidate-activation-readiness.md"
      - "tools/assess_builder_candidate_activation_readiness.py"
      - "tools/plan_builder_candidate_promotion.py"
      - "tools/builder_candidate/**"
      - "tests/candidate_activation_readiness_test.py"
      - ".github/workflows/verify-candidate-activation-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/candidate-promotion-plan-v0.schema.json"
      - "contracts/candidate-activation-readiness-v0.schema.json"
      - "docs/adr/0014-builder-candidate-activation-readiness.md"
      - "tools/assess_builder_candidate_activation_readiness.py"
      - "tools/plan_builder_candidate_promotion.py"
      - "tools/builder_candidate/**"
      - "tests/candidate_activation_readiness_test.py"
      - ".github/workflows/verify-candidate-activation-readiness.yml"

permissions:
  contents: read

concurrency:
  group: verify-candidate-activation-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Verify activation readiness contract
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile \
            tools/assess_builder_candidate_activation_readiness.py \
            tests/candidate_activation_readiness_test.py
          python tests/candidate_activation_readiness_test.py
