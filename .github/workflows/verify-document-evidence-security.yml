name: Verify document evidence security
on:
  pull_request:
  push:
    branches:
      - main
      - agent/document-evidence-immutable-storage

permissions:
  contents: read

jobs:
  upload-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check repository invariants
        run: python tools/quality/repository_guard.py --base "$(git rev-parse HEAD^)"

      - name: Build security contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.Security.ContractTests/DocumentEvidence.Security.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run security contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.Security.ContractTests/DocumentEvidence.Security.ContractTests.csproj \
            --no-build
