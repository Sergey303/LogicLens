name: Verify document evidence service boundary
on:
  pull_request:
  push:
    branches:
      - main
      - agent/document-evidence-immutable-storage

permissions:
  contents: read

env:
  SERVICE_BOUNDARY_BASE: 669b54c2ca0758a97f9cc10b32ca637db2e891fb

jobs:
  service-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned linter
        run: python -m pip install --disable-pip-version-check "ruff==0.11.13"

      - name: Check repository invariants
        run: python tools/quality/repository_guard.py --base "$SERVICE_BOUNDARY_BASE"

      - name: Check client generator style
        run: |
          ruff check tools/document_evidence/generate_client.py
          ruff format --diff --check tools/document_evidence/generate_client.py

      - name: Check deterministic client regeneration
        run: python tools/document_evidence/generate_client.py --check

      - name: Build security contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.Security.ContractTests/DocumentEvidence.Security.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run security contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.Security.ContractTests/DocumentEvidence.Security.ContractTests.csproj \
            --no-build

      - name: Build API application adapter
        run: |
          dotnet build \
            services/document-evidence/src/DocumentEvidence.Api.Application/DocumentEvidence.Api.Application.csproj \
            --nologo --warnaserror

      - name: Build generated client contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.Client.ContractTests/DocumentEvidence.Client.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run generated client contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.Client.ContractTests/DocumentEvidence.Client.ContractTests.csproj \
            --no-build

      - name: Build real HTTP contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.Api.ContractTests/DocumentEvidence.Api.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run real HTTP contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.Api.ContractTests/DocumentEvidence.Api.ContractTests.csproj \
            --no-build
