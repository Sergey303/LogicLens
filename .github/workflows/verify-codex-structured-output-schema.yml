name: Verify Codex structured-output schema

on:
  pull_request:
    paths:
      - "contracts/progressive-management-codex-response-v0.schema.json"
      - "tests/codex_structured_output_schema_contract_test.py"
      - ".github/workflows/verify-codex-structured-output-schema.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/progressive-management-codex-response-v0.schema.json"
      - "tests/codex_structured_output_schema_contract_test.py"
      - ".github/workflows/verify-codex-structured-output-schema.yml"

permissions:
  contents: read

concurrency:
  group: verify-codex-structured-output-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify strict output schema subset
        run: |
          python tests/codex_structured_output_schema_contract_test.py \
            | tee /tmp/codex-structured-output-schema.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-structured-output-schema
          path: /tmp/codex-structured-output-schema.log
          if-no-files-found: warn
          retention-days: 14
