name: Verify oracle semantic claims artifact v0

on:
  pull_request:
    paths:
      - "experiments/presentation/semantic-planning-v0/**"
      - "tools/semantic_claims_artifact.py"
      - "tools/verify_semantic_planning_benchmark.py"
      - "tools/active_epoch/hashing.py"
      - "tests/semantic_claims_artifact_test.py"
      - "docs/runbooks/semantic-claims-artifact.md"
      - ".github/workflows/verify-semantic-claims-artifact.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/presentation/semantic-planning-v0/**"
      - "tools/semantic_claims_artifact.py"
      - "tools/verify_semantic_planning_benchmark.py"
      - "tools/active_epoch/hashing.py"
      - "tests/semantic_claims_artifact_test.py"
      - "docs/runbooks/semantic-claims-artifact.md"
      - ".github/workflows/verify-semantic-claims-artifact.yml"

permissions:
  contents: read

concurrency:
  group: verify-semantic-claims-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify serializer, negative cases and all frozen cases
        shell: bash
        run: |
          python -m py_compile \
            tools/semantic_claims_artifact.py \
            tests/semantic_claims_artifact_test.py
          python tests/semantic_claims_artifact_test.py

          output_root="$(mktemp -d)"
          cases=(
            clear-revision-comparison
            opaque-revision-comparison
            ambiguous-time-excluded
            lookalike-incomparable-records
            single-entity-generic-fallback
          )
          for case_id in "${cases[@]}"; do
            artifact="$output_root/$case_id.json"
            python tools/semantic_claims_artifact.py create \
              --case-id "$case_id" \
              --output "$artifact"
            python tools/semantic_claims_artifact.py verify \
              --artifact "$artifact"
          done
