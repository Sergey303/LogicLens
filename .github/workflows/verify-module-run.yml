name: Verify complete learning runs

on:
  pull_request:
    paths:
      - "tools/module_run.py"
      - "tools/capsule.py"
      - "contracts/learning-run-v0.schema.json"
      - "contracts/capsule-*.schema.json"
      - "contracts/world-*.schema.json"
      - "tests/module_run_contract_test.py"
      - "tests/capsule_contract_test.py"
      - ".github/workflows/verify-module-run.yml"
  push:
    branches:
      - main
    paths:
      - "tools/module_run.py"
      - "tools/capsule.py"
      - "contracts/learning-run-v0.schema.json"
      - "contracts/capsule-*.schema.json"
      - "contracts/world-*.schema.json"
      - "tests/module_run_contract_test.py"
      - "tests/capsule_contract_test.py"
      - ".github/workflows/verify-module-run.yml"

permissions:
  contents: read

concurrency:
  group: verify-module-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "jsonschema==4.23.0"

      - name: Verify deterministic complete learning runs
        run: |
          python tests/module_run_contract_test.py \
            | tee /tmp/module-run-contract.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-run-contract
          path: /tmp/module-run-contract.log
          if-no-files-found: warn
          retention-days: 14
