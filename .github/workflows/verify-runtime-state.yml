name: Verify runtime state journal

on:
  pull_request:
    paths:
      - "src/LogicLens.Core/**"
      - "src/LogicLens.State/**"
      - "tests/LogicLens.State.Verification/**"
      - "docs/adr/0009-crash-safe-runtime-state-log.md"
      - "LogicLens.sln"
      - ".github/workflows/verify-runtime-state.yml"
  push:
    branches:
      - main
    paths:
      - "src/LogicLens.Core/**"
      - "src/LogicLens.State/**"
      - "tests/LogicLens.State.Verification/**"
      - "docs/adr/0009-crash-safe-runtime-state-log.md"
      - "LogicLens.sln"
      - ".github/workflows/verify-runtime-state.yml"

permissions:
  contents: read

concurrency:
  group: verify-state-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore runtime state verifier
        run: dotnet restore tests/LogicLens.State.Verification/LogicLens.State.Verification.csproj

      - name: Build runtime state verifier
        run: >-
          dotnet build
          tests/LogicLens.State.Verification/LogicLens.State.Verification.csproj
          --configuration Release
          --no-restore

      - name: Run runtime state contracts
        run: >-
          dotnet run
          --project tests/LogicLens.State.Verification/LogicLens.State.Verification.csproj
          --configuration Release
          --no-build
