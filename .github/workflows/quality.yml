name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changed-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: document_evidence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d document_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned linter
        run: python -m pip install --disable-pip-version-check "ruff==0.11.13"

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Check repository invariants
        run: |
          python tools/quality/repository_guard.py \
            --base "${{ steps.base.outputs.sha }}"

      - name: Lint changed Python files
        shell: bash
        run: |
          base="${{ steps.base.outputs.sha }}"
          git diff --name-only -z --diff-filter=ACMR "$base...HEAD" -- '*.py' \
            | xargs -0 -r ruff check
          git diff --name-only -z --diff-filter=ACMR "$base...HEAD" -- '*.py' \
            | xargs -0 -r ruff format --check

      - name: Build application boundary contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.Application.ContractTests/DocumentEvidence.Application.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run application boundary contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.Application.ContractTests/DocumentEvidence.Application.ContractTests.csproj \
            --no-build

      - name: Build generated adapter contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.GeneratedAdapter.ContractTests/DocumentEvidence.GeneratedAdapter.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run generated adapter contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.GeneratedAdapter.ContractTests/DocumentEvidence.GeneratedAdapter.ContractTests.csproj \
            --no-build

      - name: Build immutable storage contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.LocalStorage.ContractTests/DocumentEvidence.LocalStorage.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run immutable storage contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.LocalStorage.ContractTests/DocumentEvidence.LocalStorage.ContractTests.csproj \
            --no-build

      - name: Build PDF adapter contracts
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.Pdf.ContractTests/DocumentEvidence.Pdf.ContractTests.csproj \
            --nologo --warnaserror

      - name: Run PDF adapter contracts
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.Pdf.ContractTests/DocumentEvidence.Pdf.ContractTests.csproj \
            --no-build

      - name: Build PostgreSQL lifecycle integrations
        run: |
          dotnet build \
            services/document-evidence/tests/DocumentEvidence.Postgres.IntegrationTests/DocumentEvidence.Postgres.IntegrationTests.csproj \
            --nologo --warnaserror

      - name: Run PostgreSQL lifecycle integrations
        env:
          DOCUMENT_EVIDENCE_TEST_POSTGRES: >-
            Host=127.0.0.1;Port=5432;Database=document_evidence;Username=postgres;Password=postgres
        run: |
          dotnet run \
            --project services/document-evidence/tests/DocumentEvidence.Postgres.IntegrationTests/DocumentEvidence.Postgres.IntegrationTests.csproj \
            --no-build
