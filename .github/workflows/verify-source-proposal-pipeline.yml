name: Verify source proposal pipeline

on:
  pull_request:
    paths:
      - "contracts/source-*.schema.json"
      - "contracts/assertion-proposal-v0.schema.json"
      - "contracts/canonical-document-ir-v0.schema.json"
      - "contracts/pdf-*.schema.json"
      - "contracts/source-manifest-v0.schema.json"
      - "docs/architecture/SOURCE_PROPOSAL_PIPELINE_V0.md"
      - "docs/architecture/PDF_LINK_PIPELINE_V0.md"
      - "prompts/generic/source-assertion-proposer.md"
      - "tools/source_pipeline.py"
      - "tools/pdf_link_pipeline.py"
      - "tools/source_proposal/**"
      - "tests/source_pipeline_contract_test.py"
      - "tests/pdf_link_contract_test.py"
      - "tests/document_evidence_pdf_bridge*.py"
      - "tests/document_evidence_xlsx_bridge*.py"
      - "services/document-evidence/src/DocumentEvidence.Pdf/PdfSourceProposalBridge.cs"
      - "services/document-evidence/src/DocumentEvidence.Ooxml/OoxmlSource*.cs"
      - "services/document-evidence/src/DocumentEvidence.Docx/DocxEvidenceSelector.cs"
      - "services/document-evidence/src/DocumentEvidence.Xlsx/XlsxEvidenceSelector.cs"
      - "services/document-evidence/tests/fixtures/*-source-proposal-fragment-v1.jsonl"
      - ".github/workflows/verify-source-proposal-pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/source-*.schema.json"
      - "contracts/assertion-proposal-v0.schema.json"
      - "contracts/canonical-document-ir-v0.schema.json"
      - "contracts/pdf-*.schema.json"
      - "contracts/source-manifest-v0.schema.json"
      - "docs/architecture/SOURCE_PROPOSAL_PIPELINE_V0.md"
      - "docs/architecture/PDF_LINK_PIPELINE_V0.md"
      - "prompts/generic/source-assertion-proposer.md"
      - "tools/source_pipeline.py"
      - "tools/pdf_link_pipeline.py"
      - "tools/source_proposal/**"
      - "tests/source_pipeline_contract_test.py"
      - "tests/pdf_link_contract_test.py"
      - "tests/document_evidence_pdf_bridge*.py"
      - "tests/document_evidence_xlsx_bridge*.py"
      - "services/document-evidence/src/DocumentEvidence.Pdf/PdfSourceProposalBridge.cs"
      - "services/document-evidence/src/DocumentEvidence.Ooxml/OoxmlSource*.cs"
      - "services/document-evidence/src/DocumentEvidence.Docx/DocxEvidenceSelector.cs"
      - "services/document-evidence/src/DocumentEvidence.Xlsx/XlsxEvidenceSelector.cs"
      - "services/document-evidence/tests/fixtures/*-source-proposal-fragment-v1.jsonl"
      - ".github/workflows/verify-source-proposal-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: verify-source-proposal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned SWI-Prolog, Poppler and JSON Schema validator
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox poppler-utils
          swipl --version | tee /tmp/swipl-version.txt
          grep --fixed-strings "SWI-Prolog version 9.0.4" /tmp/swipl-version.txt
          pdftotext -v 2>&1 | tee /tmp/poppler-version.txt
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Run text source proposal contract
        shell: bash
        run: |
          set -o pipefail
          python tests/source_pipeline_contract_test.py | tee /tmp/source-pipeline.log

      - name: Run ephemeral PDF link contract and real Prolog gate
        shell: bash
        run: |
          set -o pipefail
          python tests/pdf_link_contract_test.py | tee /tmp/pdf-link-pipeline.log

      - name: Run PDF selected-fragment bridge and Prolog gate
        shell: bash
        run: |
          set -o pipefail
          python tests/document_evidence_pdf_bridge_test.py \
            | tee /tmp/document-evidence-pdf-bridge.log

      - name: Run XLSX selected-fragment bridge and Prolog gate
        shell: bash
        run: |
          set -o pipefail
          python tests/document_evidence_xlsx_bridge_test.py \
            | tee /tmp/document-evidence-xlsx-bridge.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-proposal-pipeline-verification
          path: |
            /tmp/swipl-version.txt
            /tmp/poppler-version.txt
            /tmp/source-pipeline.log
            /tmp/pdf-link-pipeline.log
            /tmp/document-evidence-pdf-bridge.log
            /tmp/document-evidence-xlsx-bridge.log
          if-no-files-found: warn
          retention-days: 14
