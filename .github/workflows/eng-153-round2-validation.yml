name: ENG-153 round-3 canonical generator bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eng-153-round3-bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  migrate-generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.0

      - name: Apply bounded round-3 migration
        run: python EpistemicCompilerLab/research-execution/scripts/apply_round3_canonical_generator_fix.py

      - name: Generate final canonical bytes
        run: python EpistemicCompilerLab/research-execution/scripts/generate_context_packets.py

      - name: Run exact published reviewer commands
        shell: bash
        run: |
          set -euo pipefail
          python EpistemicCompilerLab/research-execution/scripts/generate_context_packets.py --check
          python EpistemicCompilerLab/research-execution/scripts/normalize_context_command_contracts.py --check
          python EpistemicCompilerLab/research-execution/scripts/validate_context_packet.py --package WP-001

      - name: Commit canonical generator and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f EpistemicCompilerLab/research-execution/validation/validation-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/eng-153-round2-validation.yml \
            EpistemicCompilerLab/research-execution/scripts \
            EpistemicCompilerLab/research-execution/context-packets \
            EpistemicCompilerLab/research-execution/handoffs/WP-001.json \
            EpistemicCompilerLab/research-execution/validation
          git commit -m 'ENG-153: make context generation canonically reproducible [canonical generator]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
