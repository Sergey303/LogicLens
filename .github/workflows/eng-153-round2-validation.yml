name: ENG-153 round-2 validation

on:
  push:
    branches:
      - eng-153-round2-remediation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eng-153-round2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-attest-or-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.0

      - name: Generate deterministic W0 context packets and handoff
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          python EpistemicCompilerLab/research-execution/scripts/generate_context_packets.py
          if git diff --quiet -- EpistemicCompilerLab/research-execution/context-packets EpistemicCompilerLab/research-execution/handoffs/WP-001.json EpistemicCompilerLab/research-execution/scripts; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated packets
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f EpistemicCompilerLab/research-execution/validation/validation-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EpistemicCompilerLab/research-execution/context-packets \
                  EpistemicCompilerLab/research-execution/handoffs/WP-001.json \
                  EpistemicCompilerLab/research-execution/scripts \
                  EpistemicCompilerLab/research-execution/validation/validation-report.json
          git commit -m 'ENG-153: generate W0 execution packets [generated packets]'
          git push

      - name: Stop after generated commit
        if: steps.generate.outputs.changed == 'true'
        run: echo 'Generated artifacts committed; the pushed commit will be validated in the next run.'

      - name: Verify generator is clean
        if: steps.generate.outputs.changed == 'false'
        run: python EpistemicCompilerLab/research-execution/scripts/generate_context_packets.py --check

      - name: Verify committed report-only child
        if: steps.generate.outputs.changed == 'false' && contains(github.event.head_commit.message, '[validation report]')
        run: |
          python EpistemicCompilerLab/research-execution/scripts/validate_work_packages.py \
            --verify-committed-report EpistemicCompilerLab/research-execution/validation/validation-report.json \
            --require-clean

      - name: Generate report from exact clean candidate commit
        if: steps.generate.outputs.changed == 'false' && !contains(github.event.head_commit.message, '[validation report]')
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python EpistemicCompilerLab/research-execution/scripts/validate_work_packages.py \
            --as-of 2026-08-06 \
            --attest-commit "$GITHUB_SHA" \
            --require-clean \
            --report /tmp/validation-report.json
          cp /tmp/validation-report.json EpistemicCompilerLab/research-execution/validation/validation-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EpistemicCompilerLab/research-execution/validation/validation-report.json
          git commit -m 'ENG-153: commit exact candidate validation report [validation report]'
          git push
