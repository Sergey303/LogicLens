name: Verify Builder activation transaction

on:
  pull_request:
    paths:
      - "contracts/active-pointer-v0.schema.json"
      - "contracts/activation-transaction-journal-v0.schema.json"
      - "contracts/activation-transaction-attestation-v0.schema.json"
      - "docs/adr/0019-atomic-builder-activation-transaction.md"
      - "tools/apply_builder_activation_transaction.py"
      - "tests/builder_activation_transaction_test.py"
      - ".github/workflows/verify-builder-activation-transaction.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/active-pointer-v0.schema.json"
      - "contracts/activation-transaction-journal-v0.schema.json"
      - "contracts/activation-transaction-attestation-v0.schema.json"
      - "docs/adr/0019-atomic-builder-activation-transaction.md"
      - "tools/apply_builder_activation_transaction.py"
      - "tests/builder_activation_transaction_test.py"
      - ".github/workflows/verify-builder-activation-transaction.yml"

permissions:
  contents: read

concurrency:
  group: verify-builder-activation-transaction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
          sudo apt-get update -qq
          sudo apt-get install -qq --yes --no-install-recommends swi-prolog-nox

      - name: Compile transaction modules
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile \
            tools/apply_builder_activation_transaction.py \
            tests/builder_activation_transaction_test.py

      - name: Verify atomic activation and rollback
        env:
          PYTHONPATH: tools
        run: python tests/builder_activation_transaction_test.py
