name: Verify document evidence ENG-148 demo

on:
  pull_request:
    paths:
      - "services/document-evidence/tests/DocumentEvidence.EndToEndDemo/**"
      - "services/document-evidence/verify-eng-148-demo.ps1"
      - "tests/document_evidence_e2e_*.py"
      - ".github/workflows/verify-document-evidence-demo.yml"
  push:
    branches:
      - main
      - agent/document-evidence-immutable-storage
    paths:
      - "services/document-evidence/tests/DocumentEvidence.EndToEndDemo/**"
      - "services/document-evidence/verify-eng-148-demo.ps1"
      - "tests/document_evidence_e2e_*.py"
      - ".github/workflows/verify-document-evidence-demo.yml"

permissions:
  contents: read

jobs:
  pdf-to-swi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install deterministic tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils swi-prolog-nox
          python -m pip install --disable-pip-version-check "ruff==0.11.13"

      - name: Run ENG-148 deterministic proof
        shell: pwsh
        run: ./services/document-evidence/verify-eng-148-demo.ps1
