name: ENG-200 R3 bounded autofix

on:
  push:
    branches:
      - eng-200-remediation-r3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'ENG-200 R3: apply canonical serialization fix') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eng-200-remediation-r3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact serialization correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('EpistemicCompilerLab/research-execution/router-comparator/prototype/verify.py')
          text = path.read_text(encoding='utf-8')
          old = '''def canonical_feature_bytes(features: dict) -> bytes:\n    return (json.dumps(features, sort_keys=True, separators=(\",\", \":\")) + \"\\n\").encode(\"utf-8\")\n'''
          new = '''def canonical_feature_bytes(features: dict) -> bytes:\n    data = json.dumps(features, sort_keys=True, separators=(\",\", \":\")).encode(\"utf-8\")\n    require(not data.endswith(b\"\\n\"), \"canonical feature serialization must not have trailing LF\")\n    return data\n'''
          if old not in text:
              raise SystemExit('expected canonical_feature_bytes implementation not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          cd EpistemicCompilerLab/research-execution/router-comparator
          python prototype/build_freeze_manifest.py
          python prototype/build_freeze_manifest.py --check

      - name: Commit bounded remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EpistemicCompilerLab/research-execution/router-comparator/prototype/verify.py \
                  EpistemicCompilerLab/research-execution/router-comparator/ENG-200_FREEZE_MANIFEST.json
          git commit -m "ENG-200 R3: apply canonical serialization fix"
          git push origin HEAD:eng-200-remediation-r3
