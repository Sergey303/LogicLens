name: Verify progressive Epistemic DSL benchmark

on:
  pull_request:
    paths:
      - "contracts/capsule-v0.schema.json"
      - "contracts/progressive-epistemic-case-v0.schema.json"
      - "contracts/progressive-management-codex-response-v0.schema.json"
      - "contracts/progressive-management-numeric-codex-response-v0.schema.json"
      - "contracts/capsule-query-*.schema.json"
      - "contracts/epistemic-logical-rule-v0.schema.json"
      - "contracts/epistemic-observation-v0.schema.json"
      - "EpistemicCompilerLab/progressive-dsl/**"
      - "EpistemicCompilerLab/scripts/invoke_codex_json.py"
      - "EpistemicCompilerLab/scripts/run-progressive-management-codex-d0-ablation.ps1"
      - "EpistemicCompilerLab/scripts/run-progressive-management-codex-d1-ablation.ps1"
      - "tools/capsule.py"
      - "tools/capsule_query.py"
      - "tools/capsule_query_dsl_b.py"
      - "tools/capsule_query_dsl_c.py"
      - "tests/capsule_contract_test.py"
      - "tests/capsule_query_dsl_c_contract_test.py"
      - "tests/codex_structured_output_schema_contract_test.py"
      - "tests/numeric_codex_structured_output_schema_contract_test.py"
      - "tests/progressive_epistemic_case_contract_test.py"
      - "tests/progressive_management_codex_ablation_contract_test.py"
      - "tests/progressive_management_dsl_b1_contract_test.py"
      - "tests/progressive_management_dsl_b1_scoring_contract_test.py"
      - "tests/progressive_management_dsl_c_contract_test.py"
      - "tests/progressive_management_dsl_c_ablation_contract_test.py"
      - ".github/workflows/verify-progressive-epistemic-benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/capsule-v0.schema.json"
      - "contracts/progressive-epistemic-case-v0.schema.json"
      - "contracts/progressive-management-codex-response-v0.schema.json"
      - "contracts/progressive-management-numeric-codex-response-v0.schema.json"
      - "contracts/capsule-query-*.schema.json"
      - "contracts/epistemic-logical-rule-v0.schema.json"
      - "contracts/epistemic-observation-v0.schema.json"
      - "EpistemicCompilerLab/progressive-dsl/**"
      - "EpistemicCompilerLab/scripts/invoke_codex_json.py"
      - "EpistemicCompilerLab/scripts/run-progressive-management-codex-d0-ablation.ps1"
      - "EpistemicCompilerLab/scripts/run-progressive-management-codex-d1-ablation.ps1"
      - "tools/capsule.py"
      - "tools/capsule_query.py"
      - "tools/capsule_query_dsl_b.py"
      - "tools/capsule_query_dsl_c.py"
      - "tests/capsule_contract_test.py"
      - "tests/capsule_query_dsl_c_contract_test.py"
      - "tests/codex_structured_output_schema_contract_test.py"
      - "tests/numeric_codex_structured_output_schema_contract_test.py"
      - "tests/progressive_epistemic_case_contract_test.py"
      - "tests/progressive_management_codex_ablation_contract_test.py"
      - "tests/progressive_management_dsl_b1_contract_test.py"
      - "tests/progressive_management_dsl_b1_scoring_contract_test.py"
      - "tests/progressive_management_dsl_c_contract_test.py"
      - "tests/progressive_management_dsl_c_ablation_contract_test.py"
      - ".github/workflows/verify-progressive-epistemic-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: verify-progressive-epistemic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SWI-Prolog and schema dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
          swipl --version | tee /tmp/swipl-version.txt
          python -m pip install --disable-pip-version-check \
            "jsonschema==4.23.0"

      - name: Verify frozen DSL-A management cases
        run: |
          python tests/progressive_epistemic_case_contract_test.py \
            | tee /tmp/progressive-epistemic-benchmark.log

      - name: Verify non-guessable DSL-B1 management tranche
        run: |
          python tests/progressive_management_dsl_b1_contract_test.py \
            | tee /tmp/progressive-management-dsl-b1.log

      - name: Verify DSL-B1 private-policy scoring
        run: |
          python tests/progressive_management_dsl_b1_scoring_contract_test.py \
            | tee /tmp/progressive-management-dsl-b1-scoring.log

      - name: Verify typed observation DSL-C runtime
        run: |
          python tests/capsule_query_dsl_c_contract_test.py \
            | tee /tmp/capsule-query-dsl-c.log

      - name: Verify management DSL-C KPI tranche
        run: |
          python tests/progressive_management_dsl_c_contract_test.py \
            | tee /tmp/progressive-management-dsl-c.log

      - name: Verify numeric Codex output schema
        run: |
          python tests/numeric_codex_structured_output_schema_contract_test.py \
            | tee /tmp/numeric-codex-schema.log

      - name: Verify offline numeric Codex ablation runner
        run: |
          python tests/progressive_management_dsl_c_ablation_contract_test.py \
            | tee /tmp/progressive-management-dsl-c-ablation.log

      - name: Verify frozen DSL-D0 opinion contracts
        run: |
          python EpistemicCompilerLab/progressive-dsl/opinion-d0/verify_contract.py \
            | tee /tmp/progressive-management-dsl-d0.log

      - name: Verify offline DSL-D0 opinion runner
        run: |
          python EpistemicCompilerLab/progressive-dsl/opinion-d0/run_codex_ablation.py \
            --root EpistemicCompilerLab/progressive-dsl/opinion-d0 \
            --output-root /tmp/progressive-management-dsl-d0-offline \
            --fake-provider \
            --skip-prolog \
            | tee /tmp/progressive-management-dsl-d0-ablation.log

      - name: Verify frozen DSL-D1 exact boundary contracts
        run: |
          python EpistemicCompilerLab/progressive-dsl/opinion-d1/verify_contract.py \
            | tee /tmp/progressive-management-dsl-d1.log

      - name: Verify DSL-D1 Python and SWI-Prolog boundary runner
        run: |
          python EpistemicCompilerLab/progressive-dsl/opinion-d1/run_codex_ablation.py \
            --root EpistemicCompilerLab/progressive-dsl/opinion-d1 \
            --output-root /tmp/progressive-management-dsl-d1-offline \
            --fake-provider \
            --repetitions 1 \
            | tee /tmp/progressive-management-dsl-d1-ablation.log

      - name: Verify offline role-frame Codex ablation runner
        run: |
          python tests/progressive_management_codex_ablation_contract_test.py \
            | tee /tmp/progressive-management-codex-ablation.log

      - name: Upload benchmark verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progressive-epistemic-benchmark
          path: |
            /tmp/swipl-version.txt
            /tmp/progressive-epistemic-benchmark.log
            /tmp/progressive-management-dsl-b1.log
            /tmp/progressive-management-dsl-b1-scoring.log
            /tmp/capsule-query-dsl-c.log
            /tmp/progressive-management-dsl-c.log
            /tmp/numeric-codex-schema.log
            /tmp/progressive-management-dsl-c-ablation.log
            /tmp/progressive-management-dsl-d0.log
            /tmp/progressive-management-dsl-d0-ablation.log
            /tmp/progressive-management-dsl-d1.log
            /tmp/progressive-management-dsl-d1-ablation.log
            /tmp/progressive-management-codex-ablation.log
          if-no-files-found: warn
          retention-days: 14
