command_contracts:
- name: context_packet_preflight
  working_directory: .
  argv:
  - python
  - EpistemicCompilerLab/research-execution/scripts/validate_context_packet.py
  - --package
  - WP-007
  stage: pre_start
  must_exit_zero_when: packet and input manifests are intact
- name: package_acceptance_1
  working_directory: .
  argv:
  - python
  - EpistemicCompilerLab/research-execution/scripts/validate_feasibility.py
  - --preflight
  stage: post_completion
  must_exit_zero_when: all declared deliverables for this package exist
  source_working_directory: EpistemicCompilerLab
  source_argv:
  - python
  - research-execution/scripts/validate_feasibility.py
  - --resource
  - research-execution/feasibility/RESOURCE_ENVELOPE.yaml
  - --power
  - research-execution/statistics/POWER_RESULTS.json
  - --min-power
  - '0.90'
  source_command: python research-execution/scripts/validate_feasibility.py --resource
    research-execution/feasibility/RESOURCE_ENVELOPE.yaml --power research-execution/statistics/POWER_RESULTS.json
    --min-power 0.90
  availability_contract: The versioned wrapper is available before task start. The
    exact source command is retained and becomes mandatory after its declared deliverables
    exist.
checks:
  artifact:
  - 'All declared deliverables exist and validate: resource envelope, staffing plan,
    compute budget, contingency tree.'
  scientific:
  - Accepted scope preserves power >=0.90 and genuine A/B/adjudication independence.
  independence:
  - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions
    and declare prior roles/conflicts.
  adversarial:
  - Worst-case provider/model/hardware loss and no-closed-Codex fallback are explicit.
  reproducibility:
  - A clean reviewer can repeat the commands from hashes and manifests.
