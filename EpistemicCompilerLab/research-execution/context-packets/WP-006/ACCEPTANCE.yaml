command_contracts:
- name: context_packet_preflight
  working_directory: .
  argv:
  - python
  - EpistemicCompilerLab/research-execution/scripts/validate_context_packet.py
  - --package
  - WP-006
  stage: pre_start
  must_exit_zero_when: packet and input manifests are intact
- name: package_acceptance_1
  working_directory: .
  argv:
  - python
  - EpistemicCompilerLab/research-execution/scripts/validate_analysis_registry.py
  - --preflight
  stage: post_completion
  must_exit_zero_when: all declared deliverables for this package exist
  source_working_directory: EpistemicCompilerLab
  source_argv:
  - python
  - research-execution/statistics/power_simulation.py
  - --assumptions
  - research-execution/statistics/ASSUMPTIONS_MANIFEST.yaml
  - --output
  - research-execution/statistics/POWER_RESULTS.json
  source_command: python research-execution/statistics/power_simulation.py --assumptions
    research-execution/statistics/ASSUMPTIONS_MANIFEST.yaml --output research-execution/statistics/POWER_RESULTS.json
  availability_contract: The versioned wrapper is available before task start. The
    exact source command is retained and becomes mandatory after its declared deliverables
    exist.
- name: package_acceptance_2
  working_directory: .
  argv:
  - python
  - EpistemicCompilerLab/research-execution/scripts/validate_analysis_registry.py
  - --preflight
  stage: post_completion
  must_exit_zero_when: all declared deliverables for this package exist
  source_working_directory: EpistemicCompilerLab
  source_argv:
  - python
  - research-execution/scripts/validate_analysis_registry.py
  - --registry
  - research-execution/statistics/ANALYSIS_REGISTRY.yaml
  - --min-power
  - '0.90'
  - --alpha
  - '0.05'
  source_command: python research-execution/scripts/validate_analysis_registry.py
    --registry research-execution/statistics/ANALYSIS_REGISTRY.yaml --min-power 0.90
    --alpha 0.05
  availability_contract: The versioned wrapper is available before task start. The
    exact source command is retained and becomes mandatory after its declared deliverables
    exist.
checks:
  artifact:
  - 'All declared deliverables exist and validate: plan, registry, failure rules,
    simulation, assumptions, table shells.'
  scientific:
  - Power >=0.90 at two-sided alpha .05; scenario is primary unit and multiplicity
    frozen.
  independence:
  - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions
    and declare prior roles/conflicts.
  adversarial:
  - Worst-case failures and heterogeneity do not silently lower the standard.
  reproducibility:
  - A clean reviewer can repeat the commands from hashes and manifests.
