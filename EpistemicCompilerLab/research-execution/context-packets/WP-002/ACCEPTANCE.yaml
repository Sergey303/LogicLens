schema_version: 1.0.0
work_package_id: WP-002
linear_issue: ENG-154
acceptance_gate: GATE-001
command_contracts:
- name: context_packet_preflight
  working_directory: .
  argv:
  - python
  - EpistemicCompilerLab/research-execution/scripts/validate_context_packet.py
  - --package
  - WP-002
  stage: pre_start
  must_exit_zero_when: packet and input manifests are intact
- name: package_acceptance_1
  working_directory: .
  argv:
  - python
  - EpistemicCompilerLab/research-execution/scripts/validate_claim_evidence.py
  - --preflight
  stage: post_completion
  must_exit_zero_when: all declared deliverables for this package exist
  source_working_directory: EpistemicCompilerLab
  source_argv:
  - python
  - research-execution/scripts/validate_claim_evidence.py
  - --matrix
  - research-execution/CLAIM_EVIDENCE_MATRIX.yaml
  - --abstract
  - research-execution/ABSTRACT_CONTRACT.md
  source_command: python research-execution/scripts/validate_claim_evidence.py --matrix
    research-execution/CLAIM_EVIDENCE_MATRIX.yaml --abstract research-execution/ABSTRACT_CONTRACT.md
  availability_contract: The versioned wrapper is available before task start. The
    exact source command is retained and becomes mandatory after its declared deliverables
    exist.
checks:
  artifact:
  - 'All declared deliverables exist and validate: matrix, abstract contract, prohibited
    claims, row schema.'
  scientific:
  - Exactly one primary contrast/endpoint; every claim has control, evidence, table
    and failure wording.
  independence:
  - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions
    and declare prior roles/conflicts.
  adversarial:
  - Unsupported abstract sentence or prohibited wording fails.
  reproducibility:
  - A clean reviewer can repeat the commands from hashes and manifests.
