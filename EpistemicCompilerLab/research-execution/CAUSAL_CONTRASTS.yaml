schema_version: 1.1.0
work_package_id: WP-004
primary_contrast:
  contrast_id: C-PRIMARY
  treatment: M6
  comparator: M14
  baseline_placeholder: global B* selected by DEV-GLOBAL-STRONGEST-MATCHED-V2
  estimand_id: E-PRIMARY-COMPILED-BUNDLE
  headline_eligible: true
  intervention_type: multi-component deployed-interface bundle
  interpretation_boundary: trusted execution plus verified result-interface bundle versus strongest full-information non-compiled source interface
  prohibited_interpretation: the primary contrast alone does not identify execution, type structure, conclusion, compression, or renderer as the unique cause
  must_report:
  - paired counts
  - absolute difference
  - hierarchical bootstrap 95% CI
  - McNemar test
  - smallest meaningful gain comparison
  - domain/model strata
  - independent replication
  - profile-wise strongest-baseline sensitivity
falsification_contrasts:
- contrast_id: C-BUNDLE-VS-SOURCE
  modes: [M6, M14]
  objection: solver access, interface structure, or authoritative result as a bundle explains the effect
  design_response: M14 retains the complete globally selected B* representation; all compared LLM modes are padded to the same lossless block envelope. The contrast estimates only the total deployed bundle; component claims require the controls below.
- contrast_id: C-STRUCTURE
  modes: [M6, M9]
  objection: typed field structure alone explains the effect
  design_response: same verified semantic values and authoritative content, typed frame versus frozen unstructured serialization, under the same lossless token envelope.
- contrast_id: C-COPYING
  modes: [M6, M12, M10, M14]
  objection: allowedConclusion or status-label copying explains the benefit
  design_response: M12 removes allowedConclusion only; M10 exposes status only; M14 exposes no computed result. All LLM modes use the common block envelope.
- contrast_id: C-LLM-NECESSITY
  modes: [M6, M11]
  objection: LLM renderer contributes nothing
  design_response: same exact semantic frame rendered by the student or frozen deterministic templates.
- contrast_id: C-FRAME-RELIANCE
  modes: [M6, M13]
  objection: model ignores frame or blindly copies it
  design_response: one-field mutations classify follow/detect/ignore/fabricate behavior while all other bytes and envelope constraints remain frozen.
- contrast_id: C-COMPILER
  modes: [M6, M7]
  objection: production extraction/query/compiler errors create apparent renderer errors
  design_response: independent gold frame holds renderer and output contract constant.
- contrast_id: C-LENGTH
  modes: [M6, M14, M9, M10, M12, M13]
  objection: shorter or differently budgeted input explains the effect
  design_response: complete information is retained; the shared envelope is the maximum unpadded token count and only shorter modes receive neutral padding. Truncation is forbidden.
- contrast_id: C-TEACHING
  modes: [M4, M5, M14, M6]
  objection: strong teacher could achieve the same result contextually
  design_response: fixed budgets and visibility; no executed result in teacher modes; eligible teacher artifacts enter the same global DEV ranking only when their complete representation fits the lossless envelope.
- contrast_id: C-PROFILE-BASELINE
  modes: [M6, M14]
  objection: one global B* is not the strongest comparator for every model profile
  design_response: a secondary DEV-frozen B*_profile map applies the same ranking independently per profile; no outcome-driven switching is allowed.
confirmatory_minimal_set: [M6, M14, M9, M10, M11, M12, M13]
diagnostic_required_set: [M0, M1, M2, M3, M4, M5, M7, M8]
freeze_rules:
- all mode contracts, full input artifacts, transformation code, tokenizers, prompts, and output reserves hashed before HOLDOUT
- no mode addition after HOLDOUT access
- no information-removing token match or context repair after split freeze
- one-field M13 mutations preregistered and analyzed separately
- global B* and profile-sensitivity baselines selected on DEV only
- all modes attempted in randomized blocked order
- raw output stored before scoring
- failures count according to frozen analysis rule
pivot_rules:
- condition: M6 advantage vanishes against global M14
  decision: reject compilation-advantage headline; retain only supported component or failure-boundary results
- condition: M6 survives global B* but fails against profile-wise strongest controls
  decision: narrow to supported profiles and prohibit a pooled model-general claim
- condition: M6-M12 is large while M12-M14 is null
  decision: pivot to minimal executable decision-contract study; do not attribute effect to rich frame
- condition: M11 equals or exceeds M6 across task outcomes
  decision: state LLM renderer unnecessary for the evaluated task class
- condition: M13 shows unconditional corruption following
  decision: narrow auditability/safety wording and analyze frame-trust failure
- condition: M7-M6 is large
  decision: prioritize extraction/compiler boundary; do not blame renderer
- condition: lossless common envelope is infeasible for the planned benchmark/model contexts
  decision: revise dataset/source-size contract or model profiles before split construction; never truncate controls
