schema_version: 1.1.0
work_package_id: WP-004
primary:
  estimand_id: E-PRIMARY-COMPILED-BUNDLE
  question: What is the scenario-level effect of receiving a trusted compiled typed decision-interface bundle rather than the strongest full-information matched non-compiled source interface?
  treatment: M6
  comparator: M14(global B*)
  unit: base_scenario_id
  population: frozen HOLDOUT scenarios and independently sourced REPLICATION under declared model/domain profiles
  endpoint: scenario_level_exact_epistemic_contract_accuracy
  effect: paired absolute accuracy difference M6 minus M14
  aggregation: scenario is primary; paraphrases, repeats and model profiles are nested under frozen hierarchical analysis
  held_equal:
  - immutable student profile and decoding
  - question and answer/output obligations
  - source package boundary
  - lossless common token envelope computed as block maximum
  interpretation: total effect of trusted semantic execution plus verified result-interface bundle; the primary contrast does not uniquely identify execution, structure, conclusion or renderer mechanisms
  retain_if: CI supports the preregistered smallest meaningful gain, replication direction agrees, and the claim survives profile-wise strongest-baseline sensitivity
  null_wording: The compiled verified-interface bundle did not show a practically meaningful advantage over the strongest matched non-compiled control.
secondary:
- estimand_id: E-PROFILE-BASELINE-SENSITIVITY
  contrast: M6 versus M14(B*_profile)
  factor: robustness to the strongest DEV-selected non-compiled comparator for each frozen model profile
  held_equal: [selection rule, DEV-only visibility, full information, lossless token envelope, output contract]
  interpretation: not a replacement headline estimator; falsifies pooled claims supported only by a convenient global baseline
  narrow_rule: remove or qualify model-general wording when a profile-specific matched baseline is non-inferior
- estimand_id: E-STRUCTURE
  contrast: M6-M9
  factor: typed field structure
  held_equal: [verified semantic values, authoritative content, question, student, output schema, lossless token envelope]
  warning: unstructured serialization must not omit, merge or reinterpret semantic content
- estimand_id: E-CONCLUSION
  contrast: M6-M12
  factor: presence of allowedConclusion
  held_equal: [compiled status, action, scope, provenance, warnings, proof trace, student, lossless token envelope]
  pivot: If almost all effect is allowedConclusion, narrow to minimal executable decision-contract paper.
- estimand_id: E-MINIMAL-LABEL
  contrast: M6-M10
  factor: full verified frame versus status label only
  held_equal: [verified status, question, student, policy description, lossless token envelope]
  interpretation: marginal value of action, scope, provenance, warnings and proof fields as a bundle
- estimand_id: E-RENDERER
  contrast: M6-M11
  factor: LLM renderer versus deterministic template
  held_equal: [exact semantic frame, decision policy, target language/content contract]
  stop_rule: If M11 matches or exceeds M6 on all task outcomes, state LLM rendering is unnecessary for this task class.
- estimand_id: E-COMPILER-BOUNDARY
  contrast: M7-M6
  factor: production extraction/query/compiler path versus independent gold frame
  held_equal: [student renderer, frame schema, question]
  interpretation: production boundary loss; not a deployment comparison
- estimand_id: E-CORRUPTION
  contrast: M13-M6
  factor: one corrupted frame field
  held_equal: [all other fields, serialization-length class, student, question, token envelope]
  outcomes: [follow_corruption, detect_inconsistency, ignore_frame, fabricate_reconciliation]
- estimand_id: E-TEACHER-PROMPT
  contrast: M4 against its frozen unedited source mode
  factor: teacher-edited prompt
  interpretation: bounded teacher effect, not a universal teaching claim
- estimand_id: E-TEACHER-PROGRAM
  contrast: M5-M3
  factor: teacher-edited formal representation without trusted execution
  interpretation: bounded program-teacher effect
- estimand_id: E-STRONG-CEILING
  contrast: M8-M6
  factor: strong remote model versus amortized local compiled pipeline
  outcomes: [accuracy, latency, tokens, hardware, teacher amortization]
  interpretation: economic/quality ceiling, not primary causal claim
prohibited_estimands:
- M6-M3 alone as headline compilation effect
- treating E-PRIMARY-COMPILED-BUNDLE as a single-mechanism effect
- any contrast produced by deleting source information solely to match tokens
- per-paraphrase independent treatment effect
- best model/seed/domain post-hoc effect
- privacy, world-truth, learning, or universal LLM effect
- renderer quality inferred from frame correctness alone
