nodes:
  WP-201:
    linear_issue: ENG-166
    phase: W2
    kind: work_package
    title: Production runtime and matched modes M0–M14
    mandatory: true
    dependencies:
    - GATE-101
    roles:
      producer: Production Runtime Engineer
      independent_reviewer: Runtime Verification Reviewer
      gatekeeper: Independent Freeze Readiness Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: Production path and causal adapters are needed before DEV but require separate review units.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-201
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-201/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-201/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-201/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-201/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-201/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-201/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-201/HANDOFF_SCHEMA.json
    required_context:
    - PASS GATE-101
    - Frozen semantics/schemas
    - Frozen mode contracts.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/runtime/production-path-a
    - EpistemicCompilerLab/research-execution/runtime/modes
    - EpistemicCompilerLab/research-execution/contracts
    - EpistemicCompilerLab/research-execution/schemas
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No oracle B, gold, sealed data, hidden mode fields, fuzzy/probability or persistent service.
    actions:
    - Execute/review WP-201A; then execute/review WP-201B.
    - Enforce schemas and epistemic layer separation; capture proof trace/raw outputs/cold-warm metrics.
    deliverables:
    - EpistemicCompilerLab/research-execution/runtime/production-path-a
    - EpistemicCompilerLab/research-execution/runtime/PRODUCTION_BOUNDARY_REPORT.json
    - EpistemicCompilerLab/research-execution/runtime/modes
    - EpistemicCompilerLab/research-execution/runtime/MODE_FACTOR_AUDIT.json
    - EpistemicCompilerLab/research-execution/runtime/DETERMINISTIC_TEST_REPORT.json
    acceptance:
      commands:
      - python research-execution/scripts/validate_production_runtime.py --runtime research-execution/runtime/production-path-a --schemas research-execution/schemas
      - python research-execution/scripts/audit_mode_factors.py --modes research-execution/runtime/modes --contracts research-execution/MODE_CONTRACTS
      checks:
        artifact:
        - 'All declared deliverables exist and validate: runtime, boundary, modes, factor audit, tests.'
        scientific:
        - M9–M14 exact; M11 no LLM and same frame as M6.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Mode mismatch, schema bypass or oracle/gold contamination fails.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - Any factor mismatch or contamination blocks DEV.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-201.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H1
    - H3
    - H5
    - T_CAUSAL
    - T_ORACLE
    - T_INDEPENDENCE
    acceptance_gate: GATE-201
    execution_units:
    - id: WP-201A
      title: Production compiler/runtime path A
      producer: Production Compiler Engineer
      reviewer: Runtime Boundary Reviewer
      allowed_paths:
      - EpistemicCompilerLab/research-execution/runtime/production-path-a
      - EpistemicCompilerLab/research-execution/contracts
      - EpistemicCompilerLab/research-execution/schemas
      forbidden_paths:
      - EpistemicCompilerLab/research-execution/oracle/path-b
      - EpistemicCompilerLab/research-execution/sealed
      deliverables:
      - EpistemicCompilerLab/research-execution/runtime/production-path-a
      - EpistemicCompilerLab/research-execution/runtime/PRODUCTION_BOUNDARY_REPORT.json
    - id: WP-201B
      title: Matched mode adapters M0–M14
      producer: Mode Adapter Engineer
      reviewer: Causal Mode Reviewer
      dependencies:
      - WP-201A
      allowed_paths:
      - EpistemicCompilerLab/research-execution/runtime/modes
      - EpistemicCompilerLab/research-execution/MODE_CONTRACTS
      forbidden_paths:
      - EpistemicCompilerLab/research-execution/oracle/path-b
      - EpistemicCompilerLab/research-execution/sealed
      deliverables:
      - EpistemicCompilerLab/research-execution/runtime/modes
      - EpistemicCompilerLab/research-execution/runtime/MODE_FACTOR_AUDIT.json
  WP-202:
    linear_issue: ENG-167
    phase: W2
    kind: work_package
    title: Independent oracle, scorer and mutation suite
    mandatory: true
    dependencies:
    - GATE-101
    roles:
      producer: Independent Oracle Engineer
      independent_reviewer: Mutation and Dependency Auditor
      gatekeeper: Independent Freeze Readiness Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: Path B must be clean-room implemented before freeze.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-202
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-202/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-202/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-202/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-202/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-202/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-202/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-202/HANDOFF_SCHEMA.json
    required_context:
    - PASS GATE-101
    - Written semantics
    - Independent handoff
    - Mutation registry.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/oracle/path-b
    - EpistemicCompilerLab/research-execution/oracle/tests
    - EpistemicCompilerLab/research-execution/oracle/audits
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - EpistemicCompilerLab/research-execution/runtime/production-path-a
    - Production predicates, generated expected frames, model outputs.
    actions:
    - Build B only from written spec in isolated path; run dependency scan/clean-room build.
    - Implement property/mutation/differential/human tests, separate query paths and resolve unexplained A/B disagreements to zero.
    deliverables:
    - EpistemicCompilerLab/research-execution/oracle/path-b
    - EpistemicCompilerLab/research-execution/oracle/tests
    - EpistemicCompilerLab/research-execution/oracle/DEPENDENCY_AUDIT.json
    - EpistemicCompilerLab/research-execution/oracle/MUTATION_REPORT.json
    - EpistemicCompilerLab/research-execution/oracle/DIFFERENTIAL_REPORT.json
    - EpistemicCompilerLab/research-execution/oracle/CLEAN_ROOM_BUILD_REPORT.json
    - EpistemicCompilerLab/research-execution/oracle/HUMAN_AUDIT_INTERFACE
    acceptance:
      commands:
      - python research-execution/scripts/scan_oracle_dependencies.py --oracle research-execution/oracle/path-b --forbid research-execution/runtime/production-path-a
      - python research-execution/scripts/run_oracle_mutations.py --registry research-execution/oracle/CRITICAL_MUTATION_REGISTRY.yaml --expect-kill-all
      checks:
        artifact:
        - 'All declared deliverables exist and validate: path B, tests, dependency, mutation, differential, clean-room, human UI.'
        scientific:
        - All critical mutations killed; wrong provenance/scope/status/arguments fail; disagreement zero.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Any A import, circular gold or mutation miss fails.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - Any dependency/disagreement/mutation/circularity issue blocks confirmatory work.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-202.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H1
    - H3
    - T_ORACLE
    - T_INDEPENDENCE
    acceptance_gate: GATE-201
