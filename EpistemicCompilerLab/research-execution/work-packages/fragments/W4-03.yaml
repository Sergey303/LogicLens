nodes:
  WP-406:
    linear_issue: ENG-190
    phase: W4
    kind: work_package
    title: Actual TMLR/OpenReview submission and receipt
    mandatory: true
    dependencies:
    - GATE-401
    roles:
      producer: Submission Operator
      independent_reviewer: Submission Receipt Auditor
      gatekeeper: Project Lead
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: GATE-401 only authorizes; this package creates the external submission fact.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-406
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-406/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-406/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-406/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-406/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-406/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-406/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-406/HANDOFF_SCHEMA.json
    required_context:
    - PASS GATE-401
    - Authorized manuscript/supplement hashes
    - Artifact URL/access
    - Verified metadata/conflicts/disclosures/policy.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/submission
    - TMLR/OpenReview interface
    - Private author metadata store.
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No post-gate content changes, public identity or concurrent submission.
    actions:
    - Reverify hashes/anonymity; upload exact files/metadata and private author fields.
    - Submit once; capture identifier/timestamp/receipt; reopen read-only and audit uploaded hashes/platform transformations.
    deliverables:
    - EpistemicCompilerLab/research-execution/submission/SUBMISSION_RECEIPT.json
    - EpistemicCompilerLab/research-execution/submission/OPENREVIEW_RECORD.md
    - EpistemicCompilerLab/research-execution/submission/UPLOADED_HASH_AUDIT.json
    - EpistemicCompilerLab/research-execution/submission/ANONYMITY_OF_UPLOADED_VERSION.json
    - EpistemicCompilerLab/research-execution/submission/PRIVATE_IDENTIFIER_LOCATION.json
    acceptance:
      commands:
      - python research-execution/scripts/validate_submission_receipt.py --receipt research-execution/submission/SUBMISSION_RECEIPT.json --uploaded-audit research-execution/submission/UPLOADED_HASH_AUDIT.json --gate research-execution/gates/GATE-401.json
      checks:
        artifact:
        - 'All declared deliverables exist and validate: receipt, record, uploaded audit, anonymity, private location.'
        scientific:
        - ID/timestamp/venue exist; uploaded hashes authorized; public fields anonymous.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Mismatch, platform transformation or identity leak is caught by independent receipt audit.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - Mismatch/leak/error requires policy correction/withdrawal and new GATE-401 if content changes.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-406.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - T_SUBMISSION
    - T_ARTIFACT
    - T_FREEZE
    acceptance_gate: WP-406
