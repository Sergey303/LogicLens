nodes:
  WP-007:
    linear_issue: ENG-188
    phase: W0
    kind: work_package
    title: Resource, compute and annotation feasibility
    mandatory: true
    dependencies: []
    roles:
      producer: Research Feasibility Architect
      independent_reviewer: Independent Budget and Operations Reviewer
      gatekeeper: Senior Adversarial Methodology Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: GATE-001 cannot authorize a powered benchmark without compute, staffing, licensing, storage and schedule feasibility.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-007
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-007/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-007/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-007/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-007/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-007/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-007/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-007/HANDOFF_SCHEMA.json
    required_context:
    - Drafts WP-004/WP-006
    - MODEL_AND_RUN_PROTOCOL.md
    - SOURCE_AND_CASE_PROTOCOL.md
    - Hardware/environments
    - Planned matrix.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/feasibility/RESOURCE_ENVELOPE.yaml
    - EpistemicCompilerLab/research-execution/feasibility/ANNOTATION_STAFFING_PLAN.md
    - EpistemicCompilerLab/research-execution/feasibility/COMPUTE_BUDGET.md
    - EpistemicCompilerLab/research-execution/feasibility/CONTINGENCY_TREE.md
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No assumed free labour, unavailable hardware or post-result lowering of standards.
    actions:
    - Estimate source/scenario/A-B annotation/adjudication workload; specify independent roles.
    - Estimate calls, tokens, time, RAM/VRAM, storage and teacher budgets per cell.
    - Model best/base/worst cases, provider loss, contingencies preserving estimand and hard stops.
    deliverables:
    - EpistemicCompilerLab/research-execution/feasibility/RESOURCE_ENVELOPE.yaml
    - EpistemicCompilerLab/research-execution/feasibility/ANNOTATION_STAFFING_PLAN.md
    - EpistemicCompilerLab/research-execution/feasibility/COMPUTE_BUDGET.md
    - EpistemicCompilerLab/research-execution/feasibility/CONTINGENCY_TREE.md
    acceptance:
      commands:
      - python research-execution/scripts/validate_feasibility.py --resource research-execution/feasibility/RESOURCE_ENVELOPE.yaml --power research-execution/statistics/POWER_RESULTS.json --min-power 0.90
      checks:
        artifact:
        - 'All declared deliverables exist and validate: resource envelope, staffing plan, compute budget, contingency tree.'
        scientific:
        - Accepted scope preserves power >=0.90 and genuine A/B/adjudication independence.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Worst-case provider/model/hardware loss and no-closed-Codex fallback are explicit.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - Return feasible / feasible after narrowing / infeasible; narrow before case generation.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-007.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H1
    - H2
    - T_POWER
    - T_INDEPENDENCE
    - T_ARTIFACT
    acceptance_gate: GATE-001
  GATE-001:
    linear_issue: ENG-159
    phase: W0
    kind: gate
    title: Methodology and feasibility readiness decision
    mandatory: true
    dependencies:
    - WP-001
    - WP-002
    - WP-003
    - WP-004
    - WP-005
    - WP-006
    - WP-007
    roles:
      producer: Gate Decision Recorder
      independent_reviewer: Independent Methodology Decision Auditor
      gatekeeper: Senior Adversarial Methodology Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: Only PASS after all seven W0 packages unlocks W1.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/GATE-001
      files:
      - EpistemicCompilerLab/research-execution/context-packets/GATE-001/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/GATE-001/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/GATE-001/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/GATE-001/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/GATE-001/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/GATE-001/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/GATE-001/HANDOFF_SCHEMA.json
    required_context:
    - Hashed reviewed outputs WP-001…WP-007.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/gates
    - EpistemicCompilerLab/research-execution/handoffs
    - Non-sealed Linear W0 records.
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - Gatekeeper may not produce an input.
    actions:
    - Verify hashes/reviews; attack novelty, scope, causal design, oracle independence, power and feasibility.
    - Record criterion evidence, strongest objection, decision and next action.
    deliverables:
    - EpistemicCompilerLab/research-execution/gates/GATE-001.json
    acceptance:
      commands:
      - python research-execution/scripts/validate_gate.py --gate research-execution/gates/GATE-001.json --required WP-001 WP-002 WP-003 WP-004 WP-005 WP-006 WP-007
      checks:
        artifact:
        - GATE-001 decision artifact validates and every input hash/review resolves.
        scientific:
        - Every mandatory criterion has evidence and strongest unresolved objection.
        independence:
        - Gatekeeper is not producer/reviewer of critical inputs; identity/session/conflict record passes.
        adversarial:
        - REVISE/REJECT/PIVOT alternatives were attacked; no Blocker suppressed.
        reproducibility:
        - A second operator can rerun all checks without oral instructions.
    stop_or_pivot:
    - REVISE keeps W1 blocked; PIVOT updates contract; REJECT stops flagship route.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/GATE-001.json
      required_status: decision_recorded
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H1
    - H2
    - H3
    - H4
    - H5
    - H6
    - T_SCOPE
    - T_CAUSAL
    - T_ORACLE
    - T_POWER
    - T_INDEPENDENCE
    acceptance_gate: GATE-001
    decision_space:
    - PASS
    - REVISE
    - REJECT
    - PIVOT
