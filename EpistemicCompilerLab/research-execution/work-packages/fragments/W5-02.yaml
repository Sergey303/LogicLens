nodes:
  GATE-501:
    linear_issue: ENG-194
    phase: W5
    kind: gate
    title: Revision submission, venue adaptation or stop decision
    mandatory: true
    dependencies:
    - WP-503
    roles:
      producer: Gate Decision Recorder
      independent_reviewer: Independent Revision Decision Auditor
      gatekeeper: Senior Revision Evidence Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: No revision/resubmission action is automatic.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/GATE-501
      files:
      - EpistemicCompilerLab/research-execution/context-packets/GATE-501/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/GATE-501/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/GATE-501/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/GATE-501/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/GATE-501/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/GATE-501/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/GATE-501/HANDOFF_SCHEMA.json
    required_context:
    - Reviews/deadlines
    - Response matrix
    - Revision manifest/redline
    - New protocols/results/failures
    - Updated claims
    - Reproduction/anonymity.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/review/gates
    - EpistemicCompilerLab/research-execution/review/revision
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No automatic resubmission, hidden negatives or claim expansion.
    actions:
    - Attack response adequacy, post-hoc/asymmetry, reproducibility, drift, anonymity, deadline/policy and venue fit.
    - Choose exactly one action and authorized hashes.
    deliverables:
    - EpistemicCompilerLab/research-execution/review/gates/GATE-501.json
    acceptance:
      commands:
      - python research-execution/scripts/validate_gate.py --gate research-execution/review/gates/GATE-501.json --required WP-503 --require-authorized-hashes
      checks:
        artifact:
        - GATE-501 decision artifact validates and every input hash/review resolves.
        scientific:
        - Every mandatory criterion has evidence and strongest unresolved objection.
        independence:
        - Gatekeeper is not producer/reviewer of critical inputs; identity/session/conflict record passes.
        adversarial:
        - REVISE/REJECT/PIVOT alternatives were attacked; no Blocker suppressed.
        reproducibility:
        - A second operator can rerun all checks without oral instructions.
    stop_or_pivot:
    - Choose only an evidence-bounded action.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/GATE-501.json
      required_status: decision_recorded
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H1
    - H2
    - H3
    - H4
    - H5
    - H6
    - T_REVISION
    - T_ARTIFACT
    - T_SUBMISSION
    acceptance_gate: GATE-501
    decision_space:
    - SUBMIT_REVISION
    - DISCUSS_WITH_EDITOR
    - WITHDRAW_AND_ADAPT_VENUE
    - ACCEPTED_FINALIZATION
    - STOP_PUBLICATION_ROUTE
  WP-504:
    linear_issue: ENG-195
    phase: W5
    kind: work_package
    title: Execute GATE-501 and archive publication outcome
    mandatory: true
    dependencies:
    - GATE-501
    roles:
      producer: Revision/Outcome Submission Operator
      independent_reviewer: Outcome Receipt Auditor
      gatekeeper: Project Lead
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: The lifecycle terminates only after the authorized platform action and immutable outcome.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-504
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-504/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-504/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-504/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-504/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-504/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-504/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-504/HANDOFF_SCHEMA.json
    required_context:
    - PASS GATE-501
    - Authorized hashes
    - Venue policy/deadline
    - Destination contract if adapting.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/review/outcome
    - Authorized platform
    - Accepted release location.
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No unapproved changes, silent adaptation, hidden reviews, claim expansion or concurrent conflict.
    actions:
    - Verify gate/hashes; execute exact action; capture ID/timestamp/receipt/upload audit.
    - If adapting, create policy/fit matrix; if accepted, prepare camera-ready/public artifact; record status/next condition.
    deliverables:
    - EpistemicCompilerLab/research-execution/review/outcome/OUTCOME_RECEIPT.json
    - EpistemicCompilerLab/research-execution/review/outcome/UPLOADED_HASH_AUDIT.json
    - EpistemicCompilerLab/research-execution/review/outcome/PUBLICATION_STATUS.md
    - EpistemicCompilerLab/research-execution/review/outcome/CAMERA_READY_OR_ARTIFACT_RELEASE_MANIFEST.json
    acceptance:
      commands:
      - python research-execution/scripts/validate_publication_outcome.py --gate research-execution/review/gates/GATE-501.json --receipt research-execution/review/outcome/OUTCOME_RECEIPT.json --uploaded-audit research-execution/review/outcome/UPLOADED_HASH_AUDIT.json
      checks:
        artifact:
        - 'All declared deliverables exist and validate: receipt, upload audit, status, release manifest.'
        scientific:
        - Action/ID/time/hashes match gate and selected route policy.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Mismatch returns to GATE-501; no silent repair.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - Any mismatch returns to GATE-501.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-504.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - T_REVISION
    - T_SUBMISSION
    - T_ARTIFACT
    - T_FREEZE
    acceptance_gate: WP-504
