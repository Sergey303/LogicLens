nodes:
  WP-101:
    linear_issue: ENG-160
    phase: W1
    kind: work_package
    title: Written semantic, query and decision-frame contracts
    mandatory: true
    dependencies:
    - GATE-001
    roles:
      producer: Semantic Contract Engineer
      independent_reviewer: Independent Oracle Architect
      gatekeeper: Independent Contract and Data Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: Implementation-independent semantics must precede cases, runtime and scorer.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-101
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-101/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-101/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-101/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-101/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-101/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-101/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-101/HANDOFF_SCHEMA.json
    required_context:
    - PASS GATE-001
    - SOURCE_AND_CASE_PROTOCOL.md
    - ORACLE_AND_SCORER_PROTOCOL.md
    - AGENTS typed boundary.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/contracts
    - EpistemicCompilerLab/research-execution/schemas
    - EpistemicCompilerLab/research-execution/examples/semantic
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No production code as specification, probability/fuzzy, or collapsed statuses.
    actions:
    - Specify assertions, interpretation, query, status, policy, provenance and frame.
    - Create schemas, invariants, normal forms, examples and version policy; obtain second semantic review if WP-005 role conflict.
    deliverables:
    - EpistemicCompilerLab/research-execution/contracts/SEMANTIC_SPEC.md
    - EpistemicCompilerLab/research-execution/schemas/source-assertion.schema.json
    - EpistemicCompilerLab/research-execution/schemas/query.schema.json
    - EpistemicCompilerLab/research-execution/schemas/decision-frame.schema.json
    - EpistemicCompilerLab/research-execution/contracts/SEMANTIC_INVARIANTS.md
    - EpistemicCompilerLab/research-execution/contracts/VERSION_POLICY.md
    - EpistemicCompilerLab/research-execution/examples/semantic
    acceptance:
      commands:
      - python research-execution/scripts/validate_semantic_contracts.py --schemas research-execution/schemas --examples research-execution/examples/semantic
      checks:
        artifact:
        - 'All declared deliverables exist and validate: semantic spec, 3 schemas, invariants, version policy, examples.'
        scientific:
        - Unknown != false; refuted needs explicit negative; conflict/provenance/scope preserved.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Critical invalid examples and hidden ambiguity fail.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - Any ambiguity affecting gold/scorer blocks WP-103/WP-105.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-101.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H1
    - H3
    - H5
    - T_ORACLE
    - T_INDEPENDENCE
    acceptance_gate: GATE-101
  WP-102:
    linear_issue: ENG-161
    phase: W1
    kind: work_package
    title: Public source families, provenance and licensing
    mandatory: true
    dependencies:
    - GATE-001
    roles:
      producer: Source Curator
      independent_reviewer: Benchmark Architect + Artifact Reviewer
      gatekeeper: Independent Contract and Data Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: Cases need reproducible real sources and separately sealed replication families.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-102
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-102/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-102/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-102/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-102/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-102/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-102/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-102/HANDOFF_SCHEMA.json
    required_context:
    - PASS GATE-001
    - SOURCE_AND_CASE_PROTOCOL.md
    - D1–D3 definitions.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/sources/registry
    - EpistemicCompilerLab/research-execution/sources/licenses
    - EpistemicCompilerLab/research-execution/sources/manifests
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No LLM-only domains, entity-renamed templates or illegal/unverifiable sources.
    actions:
    - Choose >=2 independent families/domain plus separate replication family; hash and span-address sources.
    - Record license/redistribution tiers, defects/versions and seal replication identities from runtime/parser developers.
    deliverables:
    - EpistemicCompilerLab/research-execution/sources/SOURCE_FAMILY_REGISTRY.yaml
    - EpistemicCompilerLab/research-execution/sources/SOURCE_HASH_MANIFEST.json
    - EpistemicCompilerLab/research-execution/sources/LICENSE_AND_DISTRIBUTION_MATRIX.csv
    - EpistemicCompilerLab/research-execution/sources/PROVENANCE_ADDRESSING.md
    - EpistemicCompilerLab/research-execution/sources/REPLICATION_FAMILY_SEAL.json
    - EpistemicCompilerLab/research-execution/sources/SOURCE_DEFECTS_AND_VERSIONS.yaml
    acceptance:
      commands:
      - python research-execution/scripts/validate_source_registry.py --registry research-execution/sources/SOURCE_FAMILY_REGISTRY.yaml --licenses research-execution/sources/LICENSE_AND_DISTRIBUTION_MATRIX.csv --min-families-per-domain 2 --require-replication-family
      checks:
        artifact:
        - 'All declared deliverables exist and validate: registry, hashes, license matrix, addressing, seal, defects.'
        scientific:
        - Each domain has 2+ families and separate replication family; every assertion addressable.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Entity-renaming, source dependence and developer-access attacks fail.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - Replace any domain without independent reproducible sources before case generation.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-102.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H2
    - H6
    - T_LEAK
    - T_ARTIFACT
    acceptance_gate: GATE-101
  WP-103:
    linear_issue: ENG-162
    phase: W1
    kind: work_package
    title: Case schema, strata and blind annotation protocol
    mandatory: true
    dependencies:
    - WP-101
    - WP-102
    roles:
      producer: Benchmark Architect
      independent_reviewer: Annotation and Leakage Reviewer
      gatekeeper: Independent Contract and Data Reviewer
      identity_record_required: true
      session_separation_required: true
      conflict_declaration_required: true
    why_now: Gold and coverage rules must be fixed before cases are created.
    context_packet:
      directory: EpistemicCompilerLab/research-execution/context-packets/WP-103
      files:
      - EpistemicCompilerLab/research-execution/context-packets/WP-103/TASK.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-103/REQUIRED_READING.md
      - EpistemicCompilerLab/research-execution/context-packets/WP-103/INPUT_MANIFEST.json
      - EpistemicCompilerLab/research-execution/context-packets/WP-103/ALLOWED_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-103/FORBIDDEN_PATHS.txt
      - EpistemicCompilerLab/research-execution/context-packets/WP-103/ACCEPTANCE.yaml
      - EpistemicCompilerLab/research-execution/context-packets/WP-103/HANDOFF_SCHEMA.json
    required_context:
    - Approved semantics
    - Approved source registry
    - SOURCE_AND_CASE_PROTOCOL.md.
    allowed_paths:
    - EpistemicCompilerLab/research-execution/benchmark
    - EpistemicCompilerLab/research-execution/schemas/publication-case.schema.json
    - EpistemicCompilerLab/research-execution/annotation
    forbidden_context:
    - Future HOLDOUT or REPLICATION content before the authorized phase.
    - Pilot 18/18 or 24/24 treated as confirmatory evidence.
    - Any expansion to fuzzy membership, answer-level probability, weight training or guaranteed privacy.
    - Self-acceptance by the producer or reuse of the same unlogged session as independent reviewer.
    - No production-generated gold or model outputs during gold creation.
    actions:
    - Define base_scenario schema and nested paraphrases; freeze coverage matrix.
    - Name A/B annotators, agreement thresholds, replacement rule, adjudicator authority, alternatives, ambiguity and audit sample.
    deliverables:
    - EpistemicCompilerLab/research-execution/schemas/publication-case.schema.json
    - EpistemicCompilerLab/research-execution/benchmark/COVERAGE_MATRIX.yaml
    - EpistemicCompilerLab/research-execution/annotation/ANNOTATOR_A_INSTRUCTIONS.md
    - EpistemicCompilerLab/research-execution/annotation/ANNOTATOR_B_INSTRUCTIONS.md
    - EpistemicCompilerLab/research-execution/annotation/ADJUDICATION_FORM.schema.json
    - EpistemicCompilerLab/research-execution/annotation/AGREEMENT_THRESHOLDS.yaml
    - EpistemicCompilerLab/research-execution/annotation/ACCEPTABLE_ALTERNATIVES.yaml
    - EpistemicCompilerLab/research-execution/annotation/HUMAN_AUDIT_PLAN.md
    acceptance:
      commands:
      - python research-execution/scripts/validate_case_design.py --schema research-execution/schemas/publication-case.schema.json --coverage research-execution/benchmark/COVERAGE_MATRIX.yaml --agreement research-execution/annotation/AGREEMENT_THRESHOLDS.yaml
      checks:
        artifact:
        - 'All declared deliverables exist and validate: schema, coverage, A/B instructions, adjudication, thresholds, alternatives, audit.'
        scientific:
        - Base scenario unit; four statuses each >=15% per domain/split and required difficulty strata.
        independence:
        - Producer, independent reviewer and gatekeeper use distinct logged identities/sessions and declare prior roles/conflicts.
        adversarial:
        - Ambiguity, production-gold and annotator replacement attacks fail.
        reproducibility:
        - A clean reviewer can repeat the commands from hashes and manifests.
    stop_or_pivot:
    - No generation before review PASS; unresolved ambiguity excludes case.
    handoff:
      schema: EpistemicCompilerLab/research-execution/schemas/work-package-handoff.schema.json
      path: EpistemicCompilerLab/research-execution/handoffs/WP-103.json
      required_status: ready_for_review
      must_include:
      - identity_and_session
      - input_hashes
      - files_created
      - files_modified
      - commands_run
      - tests
      - acceptance_checks
      - known_limitations
      - protocol_deviations
      - unexpected_findings
      - recommended_next_state
    claim_or_threat_links:
    - H1
    - H2
    - H3
    - T_ORACLE
    - T_POWER
    - T_INDEPENDENCE
    acceptance_gate: GATE-101
