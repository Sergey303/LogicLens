program:
  repository: Sergey303/LogicLens
  branch: main
  working_area: EpistemicCompilerLab/
  linear_project: Compile, Don’t Teach — TMLR Flagship
  linear_project_id: f41541d3-ca1c-4df5-8be7-298a33fd2cdb
  linear_snapshot_date: '2026-08-05'
  linear_issue_scope:
  - ENG-153..ENG-184
  - ENG-188..ENG-195
  submission_terminal: WP-406
  lifecycle_terminal: WP-504
  central_claim_boundary: H1 survives only if the compiled verified interface beats the frozen strongest matched non-compiled
    baseline on the preregistered HOLDOUT primary endpoint and the direction independently replicates.
  non_claims:
  - Pilots 18/18 and 24/24 are hypothesis-forming only.
  - No claim Codex trained Qwen weights or Qwen learned Prolog.
  - No guaranteed privacy.
  - No universal reliability from one model/domain/seed.
  - Formal execution does not prove source extraction.
  current_authorization: Only W0 may execute. W1 and later remain blocked until GATE-001 PASS.
hypotheses:
  H1: Compiled verified interface outperforms the strongest matched non-compiled baseline on the frozen primary endpoint.
  H2: The direction generalizes across approved model, domain, source, rule and entity families.
  H3: After a correct verified frame, residual errors relocate to query extraction and rendering.
  H4: Fixed-budget contextual teacher editing is not guaranteed to improve a fixed-weight student and may regress.
  H5: Matched ablations identify necessary verified-frame components.
  H6: Secondary privacy-bounded portability is tested without claiming cryptographic privacy.
threat_controls:
  T_SCOPE: Scope or claim drift.
  T_CAUSAL: Solver, answer, structure, length or renderer confounding.
  T_ORACLE: Circular gold/scorer/oracle.
  T_POWER: Underpower, multiplicity or infeasibility.
  T_LEAK: Source, split, teacher or sealed-data leakage.
  T_FREEZE: Hash/config/model/scorer/analysis drift.
  T_INDEPENDENCE: Identity/session conflicts.
  T_EXTRACTION: Extraction dominates measured effect.
  T_ARTIFACT: Reproducibility, license, anonymity or undocumented steps.
  T_SUBMISSION: Authorization without actual receipt/upload audit.
  T_REVISION: Post-review favorable redesign.
