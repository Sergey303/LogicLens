context_packet_contract:
  required_files:
  - TASK.md
  - REQUIRED_READING.md
  - INPUT_MANIFEST.json
  - ALLOWED_PATHS.txt
  - FORBIDDEN_PATHS.txt
  - ACCEPTANCE.yaml
  - HANDOFF_SCHEMA.json
  generation_rule: Generate and hash before Backlog -> Todo; changed input hash invalidates execution.
  identity_rule: Record producer, reviewer and gatekeeper identity, session, prior roles and conflicts.
change_control:
  rules:
  - Linear controls status/direct dependencies; Git controls contracts/code/hashes/handoffs.
  - Update snapshot/YAML/docs/report in one bounded change.
  - No weakening MUST/STOP.
  - Creator cannot accept own critical artifact.
  - Post-freeze scientific changes create new protocol.
  invalidation_events:
  - Sealed/canary leak
  - Frozen hash/config/model/scorer/analysis change
  - Expected output reaches prompt
  - Partial outcome affects execution
  - Gold/scorer post-result change
  - Identity/session conflict
  - Best seed/favorable subset
  - Post-hoc headline metric
