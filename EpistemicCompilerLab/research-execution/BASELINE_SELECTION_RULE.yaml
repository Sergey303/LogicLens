schema_version: 1.2.0
work_package_id: WP-004
rule_id: DEV-GLOBAL-STRONGEST-MATCHED-V2
selection_timing: after all eligible DEV blocks are complete and before HOLDOUT construction or access
eligible_source_modes: [M1, M2, M3, M4, M5]
ineligible_modes:
  M0: not source-information matched
  M6: treatment
  M7: gold oracle
  M8: strong-model ceiling
  M9: receives verified result
  M10: receives verified status+action decision
  M11: deterministic treatment renderer
  M12: receives compiled status/action plus additional verified frame fields
  M13: corrupted treatment
  M14: constructed after B* selection
eligibility_requirements:
- same frozen student profile and decoding configuration as M6
- same question and common answer schema
- no computed status, action, conclusion, decision frame, solver trace or hidden gold
- source information originates from the same scenario/source package available to the M6 compiler
- the complete mode representation is retained; no assertion/rule/policy/provenance item may be truncated for matching
- teacher modes obey fixed TRAIN-only and aggregate-DEV-only visibility and budget
- full representation fits every declared model-profile context under the frozen common output reserve
- mode has complete DEV coverage and no invalidated batch
ranking:
- order: 1
  metric: scenario_level_exact_epistemic_contract_accuracy
  direction: maximize
  aggregation: one global paired scenario score; no primary per-model/domain/status switching
- order: 2
  metric: unsupported_certainty_rate
  direction: minimize
- order: 3
  metric: fabricated_provenance_rate
  direction: minimize
- order: 4
  metric: worst_preregistered_domain_accuracy
  direction: maximize
- order: 5
  metric: failure_rate
  direction: minimize
- order: 6
  metric: frozen_tie_break_order
  direction: first
  value: [M3, M2, M1, M5, M4]
construction_of_primary_control:
  output_mode_id: M14
  padding_contract: MODE_CONTRACTS/PADDING_INVARIANCE_CONTRACT.yaml
  steps:
  - select one global B* using the ranking above
  - freeze B* prompt and full representation hashes
  - instantiate B* under the common M6 answer/output obligations without adding computed fields
  - compute unpadded token counts for M6, M9, M10, M12, M13 and full-information M14 with each frozen model-profile tokenizer
  - set each scenario/model-profile block envelope to the maximum unpadded count among compared LLM modes
  - freeze exact scenario-independent padding bytes, placement and tokenizer-specific token IDs for every student profile
  - execute the DEV-only padding-invariance audit required by MODE_CONTRACTS/PADDING_INVARIANCE_CONTRACT.yaml
  - require padding-invariance PASS for every required representative mode and student profile before accepting the matched-envelope construction
  - only after invariance PASS, add the exact frozen neutral padding to shorter modes
  - store unpadded and padded token counts, padding fraction, padding byte hash and byte/token transformation manifests
  - reject the scenario from benchmark construction before split assignment if the lossless envelope plus output reserve exceeds any declared student context
matching_prohibitions:
- no deterministic or learned truncation
- no assertion/rule/policy/provenance deletion
- no outcome-dependent selection, summarization, compression or padding
- no post-HOLDOUT matching repair
- padding contains no scenario facts, rules, labels, policies, status words or decision hints
- no claim that token-length confounding is controlled when padding-invariance has not passed
token_tolerance:
  unit: model-profile tokenizer tokens
  absolute_difference_max_after_padding: 0
  conditional_on: padding_invariance_PASS
  if_unachievable: fail benchmark-construction validation before split freeze; do not create a scored missing observation
padding_invariance:
  required: true
  stage: DEV_only_before_split_freeze
  contract: MODE_CONTRACTS/PADDING_INVARIANCE_CONTRACT.yaml
  failure_action: redesign padding/envelope before benchmark construction; exact token equality never overrides a behavioral invariance failure
anti_cherry_picking:
- one global B* for the headline HOLDOUT and REPLICATION contrast
- no stratum-specific switching in the headline analysis
- no selection using latency, HOLDOUT, replication or favorable significance
- publish all eligible DEV results and ranking fields
- changes require independent review before HOLDOUT
adversarial_profile_sensitivity:
  required: true
  rule: apply the same frozen ranking independently within each model profile using DEV only
  output: one B*_profile identifier per frozen student profile
  analysis_role: secondary robustness analysis, never replacement of the global headline comparator after outcomes
  interpretation:
  - if M6 survives global B* but not profile-wise strongest baselines, narrow the pooled headline and report profile dependence
  - if a profile-specific matched baseline is non-inferior within the frozen margin, do not claim compilation advantage for that profile
result: global B*, profile-sensitivity map, M14 construction hashes, padding-invariance report and lossless token envelopes become preregistration inputs
