inclusion_rules:
- Read a primary paper or official proceedings/preprint page; snippets alone are insufficient.
- Include work changing or evaluating fixed weights, execution, symbolic representation, typed constraints, teacher
  optimization, verifier independence, or small-model behavior.
- Include adjacent work when it supplies an alternative explanation or matched-control family.
- Compare at least three nearest neighbours with one common dimension set.
exclusion_rules:
- Exclude secondary surveys without a distinct primary method or experiment.
- Exclude blogs, marketing, repository claims, and snippets without a primary paper.
- Exclude generic retrieval work without formal execution, interface, teacher, verifier, or structured-output relevance.
- Do not use future HOLDOUT/REPLICATION or pilot scores as confirmatory evidence.
