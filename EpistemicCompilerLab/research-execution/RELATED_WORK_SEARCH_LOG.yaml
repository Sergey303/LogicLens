refresh_findings:
- source_id: RW-042
  finding: >-
    SIGIL remains a materially nearest paper and occupies typed skill IR,
    deterministic lowering, model-owned versus code-owned responsibility, source
    provenance and prose-versus-compiled causal execution comparison.
- source_ids: [RW-043, RW-044, RW-045, RW-046, RW-047, RW-048, RW-049]
  finding: >-
    Offline verified artifacts and agent-skill compilers occupy broad compiler,
    reusable-program and executable-harness territory.
- source_id: RW-050
  finding: >-
    The Readout Shortcut directly motivates the answer-copying control for the
    fixed-weight core claim.
- source_id: RW-052
  finding: >-
    SOP-Agent explicitly represents SOPs as decision graphs, traverses them to
    guide agent behavior and filters valid function calls. Decision-graph/SOP or
    Prolog routing is therefore established mechanism territory, not ENG-200 novelty.
- source_id: RW-053
  finding: >-
    PA-Tool demonstrates that training-free tool-schema renaming can materially
    improve small-model tool selection. Schema naming/alignment is a mandatory
    alternative explanation for M15/M20/M22-style routing/tool-selection gains.
- source_ids: [RW-035, RW-054, RW-055, RW-056, RW-057]
  finding: >-
    Prolog-tool training, teacher agent trajectory distillation, teacher-generated
    Qwen SFT, reinforcement distillation and small-Qwen agentic RL occupy broad
    teacher-to-weight adaptation. ENG-202 is a boundary comparator only.
- source_id: RW-058
  finding: >-
    Distillation can create teacher-specific convergence in tool-use action graphs
    and response patterns, so adapted-model behavior similarity must not be read as
    evidence for the fixed-weight semantic-placement mechanism.

saturation_test:
  defining_dimensions:
  - fixed-weight small/open student
  - same benchmark compares contextual/raw/teacher-edited/executed interfaces
  - trusted deterministic runtime executes domain semantics
  - typed supported/refuted/unknown/conflicting status
  - language model consumes verified result and remains renderer
  - matched non-executed and answer-copying controls
  - independent oracle/scorer and layer error localization
  score_values: {yes: 1.0, partial: 0.5, no: 0.0, unclear: 0.0}
  exact_threshold: at_least_five_yes_of_seven
  superseded_reproducible_rounds: [Q11, Q12]
  latest_usable_saturation_rounds: [Q13, Q14]
  threshold_matches: 0
  outcome: provisional_saturation_reestablished_after_transfer_ladder_refresh
  caveat: >-
    This is producer-side search coverage, not proof of absence and not novelty
    acceptance. It never licenses first, unique, unprecedented, a general
    compiler/runtime claim, a router novelty claim, or a distillation novelty claim.

