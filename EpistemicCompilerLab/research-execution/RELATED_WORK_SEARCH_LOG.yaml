pre_submission_refresh:
  required: true
  timing: Before final claim freeze and immediately before submission packaging.
  actions:
  - Repeat all query families with dates after 2026-08-07.
  - Check forward citations of architecture anchors and transfer-ladder controls.
  - Re-run decision-graph/SOP/router and tool-schema-adaptation searches.
  - Re-run teacher-generated SFT/LoRA/QLoRA/RL/distillation and small-Qwen tool-use searches.
  - Search ACL, NeurIPS, ICML/PMLR, ICLR/OpenReview, arXiv and accepted-paper lists.
  - Re-run the seven-dimension ledger and latest saturation protocol.
  - Record occupied claims and narrow or pivot before submission.

known_limitations:
- Systematic and citation-chained but not a registered systematic review.
- Legacy Q1-Q10 cannot independently support saturation because their candidate-level screening trail was not frozen at search time.
- Q11/Q12 are reproducible but superseded for final W0 coverage after the transfer ladder expanded.
- Search interfaces do not expose stable raw database-hit counts; fresh rounds freeze unique primary candidates actually opened and screened.
- Some arXiv entries may later receive proceedings versions and require refresh.
- Absence of an exact match cannot support first, unique, unprecedented or general mechanism-priority wording.
- Producer cannot independently accept WP-003 or GATE-001.
