refresh_findings:
- source_id: RW-042
  finding: >-
    SIGIL is a materially nearest paper and occupies typed skill IR, deterministic
    lowering, model-owned versus code-owned responsibility, source provenance,
    and a prose-versus-compiled causal execution comparison. It is a mandatory
    top-three architecture anchor.
- source_ids: [RW-043, RW-044]
  finding: >-
    FACTS and Skill Discovery occupy offline generation of reusable deterministic
    or execution-verified artifacts. They narrow any broad offline-compilation claim.
- source_ids: [RW-045, RW-046, RW-047, RW-048, RW-049]
  finding: >-
    SkillRT, skill programs, Auto, SkCC and Anything2Skill further occupy portable
    compiler/runtime, typed skill compilation, reusable executable behavior and
    knowledge-to-skill territory.
- source_id: RW-050
  finding: >-
    The Readout Shortcut directly motivates the answer-copying control: small
    fixed models can copy answer-like trailing values rather than causally use
    intermediate reasoning.
- source_id: RW-051
  finding: >-
    PROTEA occupies part of intermediate-artifact scoring and workflow-node
    localization, narrowing any broad claim for layer-wise workflow diagnosis.

saturation_test:
  defining_dimensions:
  - fixed-weight small/open student
  - same benchmark compares contextual/raw/teacher-edited/executed interfaces
  - trusted deterministic runtime executes domain semantics
  - typed supported/refuted/unknown/conflicting status
  - language model consumes verified result and remains renderer
  - matched non-executed and answer-copying controls
  - independent oracle/scorer and layer error localization
  score_values: {yes: 1.0, partial: 0.5, no: 0.0, unclear: 0.0}
  exact_threshold: at_least_five_yes_of_seven
  replacement_rounds_assessed: [Q11, Q12]
  threshold_matches: 0
  outcome: provisional_saturation_reestablished_by_fresh_replacement_rounds
  caveat: >-
    This is producer-side search coverage, not proof of absence and not novelty
    acceptance. The independent reviewer must decide whether the replacement
    audit is adequate. It never licenses first, unique, unprecedented, or a
    general compiler-runtime novelty claim.

