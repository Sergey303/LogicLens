saturation_test:
  defining_dimensions:
  - fixed-weight small/open student
  - same benchmark compares contextual/raw/teacher-edited/executed interfaces
  - trusted deterministic runtime executes domain semantics
  - typed supported/refuted/unknown/conflicting status
  - language model consumes verified result and remains renderer
  - matched non-executed and answer-copying controls
  - independent oracle/scorer and layer error localization
  criterion: >-
    Two consecutive post-refresh query/citation-chain rounds add no source matching
    at least five of seven dimensions and no source occupying the exact positive comparison.
  rounds_assessed: [Q9, Q10]
  outcome: provisional_saturation_reached_after_refresh
  caveat: >-
    This does not justify first, unique, or unprecedented wording. Independent
    review, final-claim refresh, and pre-submission refresh are mandatory.
