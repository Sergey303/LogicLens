inclusion_rules:
- Read a primary paper or official proceedings/preprint page; snippets alone are insufficient.
- Include work changing or evaluating fixed weights, execution, symbolic representation, typed constraints, teacher optimization, verifier independence, small-model behavior, routing, schema adaptation, or weight adaptation.
- Include adjacent work when it supplies an alternative explanation or matched-control family.
- Compare core nearest neighbours with one common field set and one frozen seven-dimension set.
- Treat newly added router/schema/distillation papers as adversarial transfer-ladder controls unless they meet the core nearest-neighbour eligibility gate.
exclusion_rules:
- Exclude secondary surveys without a distinct primary method or experiment.
- Exclude blogs, marketing, repository claims, and snippets without a primary paper.
- Exclude generic retrieval work without formal execution, interface, teacher, verifier, structured-output, routing, schema, or adaptation relevance.
- Exclude model/provider routing papers from the core domain-router comparison when they do not move domain semantics or tool-choice knowledge.
- Exclude generic reasoning distillation from the mandatory transfer controls when a closer agent/tool/Qwen distillation paper covers the same broad weight-changing claim.
- Do not use future HOLDOUT/REPLICATION or pilot scores as confirmatory evidence.

